name: InVisionTid tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test v2 without production data
        env:
          IVT_MAL: v2
        run: node --test test/*.test.mjs
