              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <div style={{...S.entryDot,background:pc(pi)}}/>
                <span style={{fontSize:13,fontWeight:600,color:'var(--text)',flex:1}}>{proj?.name||'?'}{fixed&&<span style={{fontSize:10,color:'var(--sage)',marginLeft:4}}>Fastpris</span>}</span>
                <span style={{fontSize:12,color:'var(--text-light)',fontVariantNumeric:'tabular-nums'}}>{ph.toFixed(1)} h · {(pTimeCost+pExp+pTrip).toLocaleString('sv-SE',{maximumFractionDigits:0})} kr</span>
              </div>
            </div>})}
          {cExp>0&&<div style={{...S.momentRow,borderTop:'1px solid var(--sage-ghost)',paddingTop:6}}><span>Utlägg</span><span style={{...S.momentHours,color:'var(--accent)'}}>{cExp} kr</span></div>}
          {cTrip>0&&<div style={S.momentRow}><span>Resor: {cData.trips.reduce((s,e)=>s+e.km,0).toLocaleString('sv-SE')} km × {data.kmRate||2.5} kr/km</span><span style={{...S.momentHours,color:'var(--sage)'}}>{cTrip.toLocaleString('sv-SE',{maximumFractionDigits:0})} kr</span></div>}
        </div>})}
      {Object.keys(byClient).length===0&&<span style={S.hint}>Inga poster för perioden</span>}
      </div>}
    </div>
    {/* Month comparison */}
    {period==='month'&&<div style={S.section}>
      <button onClick={()=>setShowCompare(!showCompare)} style={S.manualToggle}>{showCompare?'▾ Dölj jämförelse':'▸ Jämför med '+monthNames2[prevMonth]}</button>
      {showCompare&&<div style={{background:'var(--card)',borderRadius:16,padding:16,marginTop:8,border:'1px solid var(--border)'}}>
        <div style={{display:'flex',gap:16}}>
          <div style={{flex:1,textAlign:'center'}}>
            <div style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'1px'}}>{monthNames2[selMonthIdx]}</div>
            <div style={{fontSize:22,fontWeight:700,color:'var(--sage-deep)',fontVariantNumeric:'tabular-nums',marginTop:4}}>{totH.toFixed(1)} h</div>
            <div style={{fontSize:16,fontWeight:600,color:'var(--sage-deep)',marginTop:2}}>{totCost.toLocaleString('sv-SE',{maximumFractionDigits:0})} kr</div>
          </div>
          <div style={{width:1,background:'var(--border)'}}/>
          <div style={{flex:1,textAlign:'center'}}>
            <div style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'1px'}}>{monthNames2[prevMonth]}</div>
            <div style={{fontSize:22,fontWeight:700,color:'var(--text-light)',fontVariantNumeric:'tabular-nums',marginTop:4}}>{prevH.toFixed(1)} h</div>
            <div style={{fontSize:16,fontWeight:600,color:'var(--text-light)',marginTop:2}}>{prevTotal.toLocaleString('sv-SE',{maximumFractionDigits:0})} kr</div>
          </div>
        </div>
        <div style={{textAlign:'center',marginTop:12,fontSize:14,fontWeight:600,color:totCost>=prevTotal?'var(--sage)':'var(--accent)'}}>
          {totCost>=prevTotal?'+':'−'}{Math.abs(totCost-prevTotal).toLocaleString('sv-SE',{maximumFractionDigits:0})} kr ({totH>=prevH?'+':'−'}{Math.abs(totH-prevH).toFixed(1)} h)
        </div>
      </div>}
    </div>}

    {/* Export */}
    <div style={S.section}>
      <button onClick={exportXLSX} style={S.exportBtn}>Exportera Excel</button>
      {(data.clients||[]).length>0&&<div style={{marginTop:12}}>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <select style={{...S.input,flex:1}} value={exportClient} onChange={e=>setExportClient(e.target.value)}>
            <option value="">Exportera per kund...</option>
            {(data.clients||[]).filter(c=>(c.status||'active')!=='closed').sort((a,b)=>a.name.localeCompare(b.name,'sv')).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
          <button onClick={()=>{if(exportClient)exportClientXLSX(exportClient)}} style={{...S.confirmBtn,opacity:exportClient?1:.4}}>Exportera</button>
        </div>
      </div>}
      {data.projects.length>0&&<div style={{marginTop:12}}>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <select style={{...S.input,flex:1}} value={exportProj} onChange={e=>setExportProj(e.target.value)}>
            <option value="">Rapport föregående månad...</option>
            {data.projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
          <button onClick={()=>{if(exportProj)printProjectReport(exportProj)}} style={{...S.confirmBtn,opacity:exportProj?1:.4}}>Skriv ut</button>
        </div>
      </div>}
    </div>
  </div>
}

// ── Sync View ──
function SyncView({data,setData,syncStatus,onSync,msConnected,onLogin,onLogout}){
  const[importStatus,setIS]=useState(null);const[showClear,setSC]=useState(false);
  const clr=()=>{setData(defaultData);saveLocal(defaultData);setSC(false);setIS('All data rensad.')};
  const exportAll=()=>{
    const json=JSON.stringify(data,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='invisiontid-backup-'+today()+'.json';a.click();
    setIS('Backup exporterad.');
  };
  const importFile=(file)=>{
    if(!file)return;const reader=new FileReader();
    reader.onload=e=>{try{
      const raw=JSON.parse(e.target.result);
      if(!raw.projects||!raw.entries){setIS('error');return}
      if(!confirm('Ersätt all nuvarande data med innehållet i backupen? Denna åtgärd kan inte ångras.'))return;
      const imported=migrate(raw);
      setData(imported);saveLocal(imported);setIS('Backup importerad ('+(imported.entries||[]).length+' poster).');
    }catch{setIS('error')}};
    reader.readAsText(file);
  };
  const tp=data.projects.length,te=data.entries.length,th=(data.entries.reduce((s,e)=>s+e.seconds,0)/3600).toFixed(1);
  const cs={background:'var(--card)',borderRadius:16,padding:18,border:'1px solid var(--border)',marginBottom:12,boxShadow:'0 4px 20px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.03)'};
  const ct={fontSize:14,fontWeight:700,color:'var(--sage-deep)',marginBottom:8,display:'flex',alignItems:'center',gap:8};
  const cd={fontSize:13,color:'var(--text-light)',lineHeight:1.5,marginBottom:12};
  const bp={...S.confirmBtn,width:'100%',padding:'12px 18px',textAlign:'center'};
  const bo={...S.exportBtn,fontSize:14,padding:'12px'};

  return<div style={{paddingTop:8}}>
    <div style={{...cs,background:'linear-gradient(135deg,var(--sage-deep) 0%,var(--sage-dark) 100%)',border:'none',color:'#fff',boxShadow:'0 6px 24px rgba(61,79,66,.25)'}}>
      <div style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'1.5px',opacity:.6,marginBottom:8}}>Din data</div>
      <div style={{display:'flex',gap:16}}><div><span style={{fontSize:24,fontWeight:700}}>{tp}</span><span style={{fontSize:12,opacity:.7,marginLeft:4}}>projekt</span></div><div><span style={{fontSize:24,fontWeight:700}}>{te}</span><span style={{fontSize:12,opacity:.7,marginLeft:4}}>poster</span></div><div><span style={{fontSize:24,fontWeight:700}}>{th}</span><span style={{fontSize:12,opacity:.7,marginLeft:4}}>timmar</span></div></div>
      {syncStatus&&<div style={{fontSize:11,opacity:.6,marginTop:8}}>{syncStatus}</div>}
    </div>
    <div style={{...cs,borderColor:msConnected?'var(--sage-light)':'var(--border)'}}>
      <div style={ct}>OneDrive-synk {msConnected&&<span style={{fontSize:11,background:'var(--sage-pale)',color:'var(--sage-deep)',padding:'3px 10px',borderRadius:10,fontWeight:600}}>Ansluten</span>}</div>
      {msConnected?<div><p style={cd}>Data synkas automatiskt mellan dina enheter. Kalendern visas i Vecka-fliken.</p><button onClick={onSync} style={bp}>Synka nu</button><button onClick={onLogout} style={{...bo,marginTop:8,color:'var(--text-muted)',borderColor:'var(--border)'}}>Logga ut</button></div>
      :<div><p style={cd}>Logga in med Microsoft för att synka data och kalender mellan telefon och dator.</p><button onClick={onLogin} style={{...bp,background:'#0078d4'}}>Logga in med Microsoft</button></div>}
    </div>
    <div style={cs}>
      <div style={ct}>Backup</div>
      <p style={cd}>Exportera all data som JSON-fil eller återställ från en tidigare backup.</p>
      <button onClick={exportAll} style={bp}>Exportera backup</button>
      <label style={{...bo,marginTop:8,display:'block',textAlign:'center',cursor:'pointer'}}>
        Importera backup
        <input type="file" accept="application/json,.json" style={{display:'none'}} onChange={e=>{importFile(e.target.files?.[0]);e.target.value=''}}/>
      </label>
    </div>
    <div style={{...cs,borderColor:'var(--accent-light)'}}><div style={ct}>Rensa data</div>{!showClear?<button onClick={()=>setSC(true)} style={{...bo,color:'var(--accent)',borderColor:'var(--accent)'}}>Radera all data</button>:<div><p style={{...cd,color:'var(--accent)',fontWeight:600}}>All data tas bort permanent.</p><div style={{display:'flex',gap:8}}><button onClick={clr} style={{...bp,background:'var(--accent)',flex:1}}>Radera</button><button onClick={()=>setSC(false)} style={{...bo,flex:1}}>Avbryt</button></div></div>}</div>
    {importStatus&&<div style={{background:importStatus==='error'?'#fef2f2':'#e8f5ee',color:importStatus==='error'?'#E07A5F':'#2D6A4F',padding:'12px 16px',borderRadius:10,fontSize:13,fontWeight:500,marginTop:8}}>{importStatus==='error'?'Kunde inte läsa filen.':importStatus}</div>}
  </div>
}

// ── Main App ──
function App(){
  const[data,setData]=useState(loadLocal());const[tab,setTab]=useState('timer');const[syncStatus,setSS]=useState(null);const[msC,setMsC]=useState(false);const stRef=useRef(null);const lsRef=useRef(JSON.stringify(data));
  const[showSettings,setShowSettings]=useState(false);
  const[weekOffset,setWeekOffset]=useState(0);
  const toast=useToast();
  // Gemensam felvisning: behåller '⚠ … – klicka …'-prefixet så befintlig
  // klicka-för-att-försöka-igen-logik fortsätter funka, plus en tydlig toast.
  const syncFail=(e,phase)=>{const msg=(e&&e.message)||'Kunde inte synka';setSS('⚠ '+msg+' – klicka för att försöka igen');setMsC(!!getMsToken());toast('✗ Synk misslyckades'+(phase?' ('+phase+')':'')+': '+msg);console.error('Sync error',phase,e);};

  useEffect(()=>{const rt=checkAuthRedirect();const t=rt||getMsToken();if(!t)return;setMsC(true);setSS('Synkar...');(async()=>{try{
    const remote=await oneDriveRead(t);
    if(remote){const m=mergeData(loadLocal(),remote);setData(m);saveLocal(m);lsRef.current=JSON.stringify(m);setSS('Synkad ✓');setTimeout(()=>setSS(null),3000)}
    else{await oneDriveWrite(t,loadLocal());setSS('Uppladdad ✓');setTimeout(()=>setSS(null),3000)} // remote===null ⇒ 404, ingen fil ännu
  }catch(e){syncFail(e,'inläsning')}})();},[]);

  useEffect(()=>{saveLocal(data);const ds=JSON.stringify(data);if(ds===lsRef.current)return;const t=getMsToken();if(!t)return;if(stRef.current)clearTimeout(stRef.current);stRef.current=setTimeout(async()=>{setSS('Sparar...');try{await oneDriveWrite(t,data);lsRef.current=ds;setSS('Synkad ✓');setTimeout(()=>setSS(null),3000)}catch(e){syncFail(e,'sparning')}},2000)},[data]);

  const doSync=async()=>{const t=getMsToken();if(!t){setMsC(false);return}setSS('Synkar...');try{
    const r=await oneDriveRead(t);
    if(r){const m=mergeData(data,r);setData(m);saveLocal(m);await oneDriveWrite(t,m);lsRef.current=JSON.stringify(m);setSS('Synkad ✓')}
    else{await oneDriveWrite(t,data);lsRef.current=JSON.stringify(data);setSS('Uppladdad ✓')} // 404 ⇒ säkert att ladda upp lokal data
    setTimeout(()=>setSS(null),3000);
  }catch(e){syncFail(e,'synk')}};
  const doLogin=()=>{window.location.href=msLoginUrl()};const doLogout=()=>{clearMsToken();setMsC(false);setSS(null)};

  const tabs=[{id:'timer',l:'Logga'},{id:'dash',l:'Dashboard'},{id:'week',l:'Vecka'},{id:'entries',l:'Historik'},{id:'report',l:'Rapport'}];

  return<div id="root-inner">
    <InstallBanner/>
    {showSettings&&<div className="modal-overlay" onClick={()=>setShowSettings(false)}><div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:500}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <span style={S.modalTitle}>Synk & data</span>
        <button onClick={()=>setShowSettings(false)} style={{...S.deleteBtn,fontSize:24}}>x</button>
      </div>
      <div style={{marginBottom:18}}>
        <span style={{fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:'1.5px',color:'var(--text-muted)',display:'block',marginBottom:10}}>Inställningar</span>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:80}}><label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.8px'}}>Timpris (kr/h)</label><input type="number" style={{padding:'10px 12px',borderRadius:14,border:'1.5px solid var(--border)',background:'var(--card)',fontSize:16,color:'var(--text)',fontFamily:'inherit',width:'100%',marginTop:4}} value={data.hourlyRate} onChange={e=>{const n=parseInt(e.target.value)||0;const u={...data,hourlyRate:n};setData(u);saveLocal(u)}}/></div>
          <div style={{flex:1,minWidth:80}}><label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.8px'}}>Milersättning (kr/km)</label><input type="number" step="0.5" style={{padding:'10px 12px',borderRadius:14,border:'1.5px solid var(--border)',background:'var(--card)',fontSize:16,color:'var(--text)',fontFamily:'inherit',width:'100%',marginTop:4}} value={data.kmRate||2.5} onChange={e=>{const n=parseFloat(e.target.value)||0;const u={...data,kmRate:n};setData(u);saveLocal(u)}}/></div>
          <div style={{flex:1,minWidth:80}}><label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.8px'}}>Veckomål (kr)</label><input type="number" step="1000" style={{padding:'10px 12px',borderRadius:14,border:'1.5px solid var(--border)',background:'var(--card)',fontSize:16,color:'var(--text)',fontFamily:'inherit',width:'100%',marginTop:4}} placeholder="0" value={data.weeklyGoal||''} onChange={e=>{const n=parseInt(e.target.value)||0;const u={...data,weeklyGoal:n};setData(u);saveLocal(u)}}/></div>
          <div style={{flex:1,minWidth:80}}><label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.8px'}}>Varna efter (dagar)</label><input type="number" min="1" style={{padding:'10px 12px',borderRadius:14,border:'1.5px solid var(--border)',background:'var(--card)',fontSize:16,color:'var(--text)',fontFamily:'inherit',width:'100%',marginTop:4}} value={data.settings?.staleWarningDays??7} onChange={e=>{const n=parseInt(e.target.value)||0;const u={...data,settings:{...(data.settings||{}),staleWarningDays:n>0?n:7}};setData(u);saveLocal(u)}}/></div>
        </div>
      </div>
      <SyncView data={data} setData={setData} syncStatus={syncStatus} onSync={doSync} msConnected={msC} onLogin={doLogin} onLogout={doLogout}/>
    </div></div>}
    {/* Desktop sidebar */}
    <div className="desktop-sidebar">
      <button onClick={()=>setShowSettings(true)} style={{background:'none',border:'none',padding:0,display:'flex',alignItems:'center',gap:8,cursor:'pointer',marginBottom:24}} title="Inställningar">
        <img src={LOGO_SRC} alt="In Vision" style={{height:24}}/>
        <span style={S.logoSub}>tid</span>
      </button>
      {syncStatus&&<div onClick={syncStatus.startsWith('⚠')?doSync:undefined} style={{fontSize:11,color:syncStatus.startsWith('⚠')?'var(--accent)':'var(--text-muted)',marginBottom:16,cursor:syncStatus.startsWith('⚠')?'pointer':'default',fontWeight:syncStatus.startsWith('⚠')?600:400}}>{syncStatus}{msC&&<span style={{display:'inline-block',width:6,height:6,borderRadius:'50%',background:'var(--sage)',marginLeft:6,verticalAlign:'middle'}}/>}</div>}
      <div style={{display:'flex',flexDirection:'column',gap:4}}>
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:12,border:'none',background:tab===t.id?'var(--sage-ghost)':'transparent',color:tab===t.id?'var(--sage-deep)':'var(--text-muted)',fontFamily:'inherit',fontSize:14,fontWeight:tab===t.id?600:400,cursor:'pointer',textAlign:'left'}}><Icon id={t.id} size={18}/>{t.l}</button>)}
      </div>
      <div style={{marginTop:'auto'}}>
        <button onClick={()=>setShowSettings(true)} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',borderRadius:12,border:'none',background:'transparent',color:'var(--text-muted)',fontFamily:'inherit',fontSize:13,cursor:'pointer',width:'100%'}}>Inställningar</button>
      </div>
    </div>

    {/* Main content */}
    <div className="desktop-main">
      {/* Mobile header */}
      <div style={S.header} className="mobile-header">
        <button onClick={()=>setShowSettings(true)} style={{background:'none',border:'none',padding:0,display:'flex',alignItems:'center',gap:8,cursor:'pointer'}} title="Synk och data">
          <img src={LOGO_SRC} alt="In Vision" style={{height:28}}/>
          <span style={S.logoSub}>tid</span>
        </button>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
          {syncStatus&&<span onClick={syncStatus.startsWith('⚠')?doSync:undefined} style={{fontSize:11,color:syncStatus.startsWith('⚠')?'var(--accent)':'var(--text-muted)',animation:'fadeIn 0.3s ease',cursor:syncStatus.startsWith('⚠')?'pointer':'default',fontWeight:syncStatus.startsWith('⚠')?600:400}}>{syncStatus}</span>}
          {msC&&<div style={{width:8,height:8,borderRadius:'50%',background:'var(--sage)',boxShadow:'0 0 0 3px var(--sage-pale)'}} title="OneDrive ansluten"/>}
        </div>
      </div>
      <div className="mobile-nav"><TabBar active={tab} onChange={setTab}/></div>

    <div style={S.content}>
      {tab==='timer'&&<TimerView data={data} setData={setData} openSettings={()=>setShowSettings(true)}/>}
      {tab==='dash'&&<DashboardView data={data} weekOffset={weekOffset} setWeekOffset={setWeekOffset}/>}
      {tab==='week'&&<WeekView data={data} setData={setData} msConnected={msC} weekOffset={weekOffset} setWeekOffset={setWeekOffset}/>}
      {tab==='entries'&&<EntriesView data={data} setData={setData} weekOffset={weekOffset} setWeekOffset={setWeekOffset}/>}
      {tab==='report'&&<ReportView data={data} setData={setData}/>}
    </div>
    </div>
  </div>
}

ReactDOM.createRoot(document.getElementById('root')).render(<ToastProvider><App/></ToastProvider>);
</script>
<script>
function _esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
window.addEventListener('error',function(e){var r=document.getElementById('root');if(r&&!r.hasChildNodes()){r.innerHTML='<div style="padding:20px;font-family:system-ui;max-width:600px;margin:auto;"><h2 style="color:#E07A5F;">Fel vid laddning</h2><p>'+_esc(e.message)+'</p><p>Rad: '+_esc(e.lineno)+', Kolumn: '+_esc(e.colno)+'</p><p>Fil: '+_esc(e.filename||'okänd')+'</p></div>'}});
window.onerror=function(msg,src,line,col,err){var r=document.getElementById('root');if(r&&!r.hasChildNodes()){r.innerHTML='<div style="padding:20px;font-family:system-ui;max-width:600px;margin:auto;"><h2 style="color:#E07A5F;">Fel vid laddning</h2><p>'+_esc(msg)+'</p><p>Rad: '+_esc(line)+', Kolumn: '+_esc(col)+'</p>'+(err?'<pre style="font-size:12px;overflow:auto;background:#f5f5f5;padding:10px;border-radius:8px">'+_esc(err.stack)+'</pre>':'')+'</div>'}}
</script>
</body>
</html>
