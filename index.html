*{box-sizing:border-box;margin:0;padding:0}
:root{--sage:#5E7368;--sage-dark:#3A4B3E;--sage-deep:#1F2F22;--sage-light:#8FA594;--sage-pale:#E8E3D4;--sage-ghost:#EFEADD;--warm:#F1EBDE;--text:#1A1816;--text-light:#4E4A42;--text-muted:#6F6959;--accent:#BA5E3C;--accent-light:#F0D9CB;--success:#B8943A;--border:#E5DFD1;--card:#FDFBF7;--radius:14px}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--warm);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;font-weight:400;letter-spacing:0.01em}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
input:focus,select:focus,textarea:focus{border-color:var(--sage)!important;outline:none;box-shadow:0 0 0 3px rgba(94,115,104,0.12)}
button{cursor:pointer;font-family:inherit;transition:all 0.2s ease}
button:active{transform:scale(0.97)}
@media(hover:hover){button:hover{opacity:.9}}
#root{margin:0 auto;min-height:100vh}
.install-banner{background:var(--sage-deep);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500}
.install-banner button{background:var(--sage-light);color:var(--sage-deep);border:none;border-radius:10px;padding:8px 18px;font-weight:600;font-size:13px}
.install-banner .dismiss{background:transparent;color:rgba(255,255,255,.5);font-size:18px;padding:0 4px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,51,49,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fadeIn 0.2s ease}
.modal{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(44,51,49,.15),0 0 0 1px var(--border)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--sage-deep);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:500;z-index:200;box-shadow:0 8px 30px rgba(45,62,51,.35);display:flex;align-items:center;gap:12px;animation:slideUp 0.3s ease;font-family:'Outfit',system-ui,sans-serif;max-width:90vw}
.toast button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}

/* Mobile: larger text, buttons and labels */
@media(max-width:600px){
  body{font-size:16px}
  input,select,textarea{font-size:16px!important;padding:12px 16px!important}
  button{font-size:15px!important;padding:12px 16px!important}
  .install-banner{font-size:14px}
  .install-banner button{font-size:14px;padding:10px 20px}
  .modal{padding:20px}
}

/* Desktop: wider layout with sidebar nav */
@media(min-width:768px){
  #root-inner{display:flex;flex-direction:row;min-height:100vh}
  .desktop-sidebar{display:flex!important;flex-direction:column;width:220px;background:var(--card);border-right:1px solid var(--border);padding:20px 16px;position:fixed;top:0;left:0;height:100vh;z-index:50}
  .desktop-main{margin-left:220px;flex:1;padding:0 40px}
  .mobile-nav{display:none!important}
  .mobile-header{display:none!important}
}
@media(max-width:767px){
  .desktop-sidebar{display:none!important}
  .desktop-main{max-width:100%}
  #root{max-width:540px;padding-bottom:90px}
}
@media(max-width:380px){
  .tab-label{display:none!important}
}

const TOKEN_KEY='invisiontid-ms-token';
const TOKEN_EXPIRY_KEY='invisiontid-ms-expiry';

// ── Data model ──
// data = { clients:[], projects:[], entries:[], expenses:[], trips:[], invoices:[], hourlyRate:850, kmRate:2.5, weeklyGoal:0, settings:{} }
// settings = { staleWarningDays:7 }   // appinställningar som inte är belopp
// client = { id, name, contact, phone, email, orgNr, address, status?:'active'|'paused'|'closed' }
// project = { id, name, clientId?, hourlyRate?, sessionPrice?, defaultTripKm?, pricingPeriods?:[{id,startDate,endDate?,type:'hourly'|'fixed',amount}] }
// entry = { id, projectId, moment, seconds, date, startTime?, endTime?, createdAt, note?, calEventId? }
// expense = { id, projectId, amount, description, date, createdAt }
// trip = { id, projectId, km, description, date, createdAt }
// invoice = { projectId, month:'2026-03', invoicedAt:'2026-04-02' }
const SCHEMA_VERSION=1;
const defaultData={schemaVersion:SCHEMA_VERSION,clients:[],projects:[],entries:[],expenses:[],trips:[],invoices:[],deletedIds:{},hourlyRate:850,kmRate:2.5,weeklyGoal:0,settings:{staleWarningDays:7}};

// ── Storage ──
// migrate() är enda stället som normaliserar/uppgraderar datamodellen.
// Körs på allt som läses in (localStorage, OneDrive, importerad backup) så
// gammal data alltid får dagens struktur. Lägg framtida steg som
// `if(d.schemaVersion<N){…}` före versionsstämpeln.
function migrate(d){
  d=(d&&typeof d==='object')?d:{};
  if(!Array.isArray(d.clients))d.clients=[];
  if(!Array.isArray(d.projects))d.projects=[];
  if(!Array.isArray(d.entries))d.entries=[];
  if(!Array.isArray(d.expenses))d.expenses=[];
  if(!Array.isArray(d.trips))d.trips=[];
  if(!Array.isArray(d.invoices))d.invoices=[];
  if(!d.deletedIds||typeof d.deletedIds!=='object')d.deletedIds={};
  if(d.hourlyRate==null)d.hourlyRate=850;
  if(d.kmRate==null)d.kmRate=2.5;
  if(d.weeklyGoal==null)d.weeklyGoal=0;
  if(!d.settings||typeof d.settings!=='object')d.settings={};
  if(d.settings.staleWarningDays==null)d.settings.staleWarningDays=7;
  // Framtida migreringar här, t.ex.: if((d.schemaVersion||0)<2){ … }
  d.schemaVersion=SCHEMA_VERSION;
  return d;
}
function loadLocal(){try{const r=localStorage.getItem(STORAGE_KEY);return migrate(r?JSON.parse(r):{...defaultData})}catch{return migrate({...defaultData})}}
function saveLocal(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}catch(e){console.error(e)}}

// ── MS Auth ──
function getMsToken(){const t=localStorage.getItem(TOKEN_KEY);const e=parseInt(localStorage.getItem(TOKEN_EXPIRY_KEY)||'0');if(t&&Date.now()<e)return t;return null}
function saveMsToken(t,ei){localStorage.setItem(TOKEN_KEY,t);localStorage.setItem(TOKEN_EXPIRY_KEY,String(Date.now()+ei*1000))}

// ── Merge ──
// Merges local+remote using:
//  - updatedAt (fallback createdAt) to pick latest version when same id appears on both sides
//  - deletedIds (id → deletedAt timestamp) as tombstones so deletions survive round-trips
function mergeData(local,remote){
  if(!remote||!remote.projects||!remote.entries)return local;
  // Combine tombstones, keeping latest deletedAt per id
  const mergedDeleted={...(remote.deletedIds||{}),...(local.deletedIds||{})};
  Object.keys(remote.deletedIds||{}).forEach(id=>{
    const r=remote.deletedIds[id],l=local.deletedIds?.[id];
    if(!l||r>l)mergedDeleted[id]=r;
  });
  const tombstoneTime=id=>mergedDeleted[id]||null;
  const timeOf=x=>x.updatedAt||x.createdAt||'';
  // Order: local first, remote second. Using >= means remote wins on tie
  // (OneDrive is source of truth for records without updatedAt bumps).
  const merge=(la,ra)=>{
    const m=new Map();
    [...(la||[]),...(ra||[])].forEach(x=>{
      const tomb=tombstoneTime(x.id);
      if(tomb&&tomb>=timeOf(x))return; // item deleted after (or at) its last update → drop
      const existing=m.get(x.id);
      if(!existing||timeOf(x)>=timeOf(existing))m.set(x.id,x);
    });
    return Array.from(m.values());
  };
  // Merge invoices: keep latest per project+month (no tombstones needed; small identity)
  const mergedInvoices=[...new Map([...(remote.invoices||[]),...(local.invoices||[])].map(i=>[i.projectId+'|'+i.month,i])).values()];
  return migrate({clients:merge(local.clients,remote.clients),projects:merge(local.projects,remote.projects),entries:merge(local.entries,remote.entries),expenses:merge(local.expenses,remote.expenses),trips:merge(local.trips,remote.trips),invoices:mergedInvoices,deletedIds:mergedDeleted,hourlyRate:local.hourlyRate??remote.hourlyRate??850,kmRate:local.kmRate??remote.kmRate??2.5,weeklyGoal:local.weeklyGoal??remote.weeklyGoal??0,settings:{...(remote.settings||{}),...(local.settings||{})}});
}

// ── Calendar API ──
async function fetchCalendarEvents(token, startDate, endDate) {
  try {
    // Send times with explicit timezone offset for Stockholm (CET/CEST)
    // Use midnight local time - Graph will handle DST correctly with the Prefer header
    const url = `https://graph.microsoft.com/v1.0/me/calendar/calendarview?startDateTime=${startDate}T00:00:00.000Z&endDateTime=${endDate}T23:59:59.000Z&$orderby=start/dateTime&$top=100&$select=subject,start,end,isAllDay`;
    const r = await fetch(url, { headers: { Authorization: `Bearer ${token}`, Prefer: 'outlook.timezone="Europe/Stockholm"' } });
    if (!r.ok) return [];
    const data = await r.json();
    return (data.value || []).map(ev => {
      // Graph returns times in Stockholm timezone thanks to Prefer header
      const startDt = ev.start?.dateTime || '';
      const endDt = ev.end?.dateTime || '';
      // Extract date part directly from the returned Stockholm-local time
      const evDate = startDt.slice(0, 10);
      return {
        id: ev.id,
        subject: ev.subject || '(Ingen rubrik)',
        start: startDt,
        end: endDt,
        isAllDay: ev.isAllDay || false,
        date: evDate,
      };
    });
  } catch (e) { console.error('Calendar read error:', e); return []; }
}

// Parse Graph datetime as local (no timezone conversion)
function parseLocalDt(dtStr) {
  if (!dtStr) return null;
  // Remove any trailing Z or timezone - treat as local
  const clean = dtStr.replace(/[Z+].*$/, '');
  const parts = clean.split(/[-T:\.]/);
  return new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]), parseInt(parts[3]||0), parseInt(parts[4]||0), parseInt(parts[5]||0));
}

function calEventDuration(ev) {
  try {
    const s = parseLocalDt(ev.start), e = parseLocalDt(ev.end);
    if (!s || !e) return 0;
    return Math.max(Math.round((e - s) / 1000), 0);
  } catch { return 0; }
}

function calEventTimeStr(ev) {
  try {
    const s = parseLocalDt(ev.start);
    const e = parseLocalDt(ev.end);
    return `${String(s.getHours()).padStart(2,'0')}:${String(s.getMinutes()).padStart(2,'0')}–${String(e.getHours()).padStart(2,'0')}:${String(e.getMinutes()).padStart(2,'0')}`;
  } catch { return ''; }
}

// ── Pricing helpers ──
// Three pricing models:
// 1. Timpris (hourly): project.hourlyRate or data.hourlyRate (default)
// 2. Pris per tillfälle (session): project.sessionPrice - each unique logged date = 1 session
// 3. Fastpris över period (fixed): project.pricingPeriods with type='fixed' - distributed over days

function getRate(project,data){return project?.hourlyRate??data.hourlyRate??850}
function hasSessionPrice(project){return project?.sessionPrice>0}
function isFixedPrice(project){return(project?.pricingPeriods||[]).some(p=>p.type==='fixed')}
function getActivePeriod(project,date){if(!project?.pricingPeriods?.length)return null;return project.pricingPeriods.find(p=>date>=p.startDate&&(!p.endDate||date<=p.endDate))||null}

// Count unique days logged for a project within given entries
function getSessionCount(project,entries){if(!hasSessionPrice(project))return 0;const dates=new Set(entries.filter(e=>e.projectId===project.id).map(e=>e.date));return dates.size}
function getSessionRevenue(project,entries){return getSessionCount(project,entries)*project.sessionPrice}

// Calculate revenue for a set of entries (used everywhere)
// Priority: sessionPrice > pricingPeriod > hourlyRate
function calcRevenue(entries,data){
  let total=0;const sessDays=new Set();
  entries.forEach(e=>{
    const p=data.projects.find(x=>x.id===e.projectId);if(!p)return;
    // Model 1: Session price (per unique day) - takes priority over everything
    if(hasSessionPrice(p)){const key=e.projectId+'|'+e.date;if(!sessDays.has(key)){sessDays.add(key);total+=p.sessionPrice}return}
    // Model 2: Check for pricing period on this date
    const period=getActivePeriod(p,e.date);
    if(period?.type==='fixed')return; // Fixed periods counted separately via calcFixedMonthly/getFixedWeeklyAmount
    if(period?.type==='hourly'&&period.amount){total+=(e.seconds/3600)*period.amount;return}
    // Model 3: If project has ANY fixed pricing periods, don't fall back to hourly
    // (the entry date is outside the period range - don't count it as hourly)
    if(isFixedPrice(p))return;
    // Model 4: Standard hourly rate (only if no other pricing model exists)
    total+=(e.seconds/3600)*getRate(p,data);
  });
  return total;
}

// Calculate fixed period amounts for entries in a given month (year, monthIndex 0-11)
// Divides evenly by number of months the period spans
function calcFixedMonthly(data,year,month){
  let total=0;
  const mStart=year+'-'+String(month+1).padStart(2,'0')+'-01';
  const mEndDay=new Date(year,month+1,0).getDate();
  const mEnd=year+'-'+String(month+1).padStart(2,'0')+'-'+String(mEndDay).padStart(2,'0');
  data.projects.forEach(p=>{(p.pricingPeriods||[]).forEach(pp=>{
    if(pp.type!=='fixed'||!pp.amount)return;
    const start=pp.startDate;const end=pp.endDate;
    if(!end){if(start>=mStart&&start<=mEnd)total+=pp.amount;return}
    if(mStart>end||mEnd<start)return;
    // Count total months the period spans
    const sY=parseInt(start.slice(0,4)),sM=parseInt(start.slice(5,7))-1;
    const eY=parseInt(end.slice(0,4)),eM=parseInt(end.slice(5,7))-1;
    const totalMonths=Math.max(1,(eY-sY)*12+(eM-sM)+1);
    total+=Math.round(pp.amount/totalMonths);
  })});
  return total;
}

// Calculate fixed period amounts for a specific week
// Uses monthly amount / ~4.33 weeks for consistency with calcFixedMonthly
function getFixedWeeklyAmount(project,weekDates){
  if(!project?.pricingPeriods)return 0;let total=0;
  project.pricingPeriods.forEach(p=>{
    if(p.type!=='fixed'||!p.amount)return;
    const start=p.startDate;const end=p.endDate;
    if(!end){if(weekDates[0]<=start&&start<=weekDates[6])total+=p.amount;return}
    if(weekDates[6]<start||weekDates[0]>end)return;
    // Fördela fastpriset per DAG så att veckosummorna summerar till månadsbeloppet
    // (calcFixedMonthly). Månadsbelopp = amount/totalMonths; dagsbelopp = månadsbeloppet
    // delat på periodens täckta dagar i just den månaden. Bara dagar inom perioden räknas,
    // så gränsveckor mellan månader fördelas rätt istället för att räknas som hela veckor.
    const sY=parseInt(start.slice(0,4)),sM=parseInt(start.slice(5,7))-1;
    const eY=parseInt(end.slice(0,4)),eM=parseInt(end.slice(5,7))-1;
    const totalMonths=Math.max(1,(eY-sY)*12+(eM-sM)+1);
    const monthlyAmount=p.amount/totalMonths;
    weekDates.forEach(d=>{
      if(d<start||d>end)return;
      const y=parseInt(d.slice(0,4)),mo=parseInt(d.slice(5,7))-1;
      const dim=new Date(y,mo+1,0).getDate();
      const mFirst=`${y}-${String(mo+1).padStart(2,'0')}-01`;
      const mLast=`${y}-${String(mo+1).padStart(2,'0')}-${String(dim).padStart(2,'0')}`;
      const cStartDay=parseInt((start>mFirst?start:mFirst).slice(8,10));
      const cEndDay=parseInt((end<mLast?end:mLast).slice(8,10));
      const coveredDays=Math.max(1,cEndDay-cStartDay+1);
      total+=monthlyAmount/coveredDays;
    });
  });
  return Math.round(total);
}

// Calculate total weekly revenue (for weekly goal)
function calcWeekRevenue(data,weekDates){
  const wEntries=data.entries.filter(e=>weekDates.includes(e.date));
  let rev=calcRevenue(wEntries,data);
  data.projects.forEach(p=>{rev+=getFixedWeeklyAmount(p,weekDates)});
  return rev;
}

// Gemensam vecko-sammanfattning – ENDA källan för veckans siffror.
// Används av både DashboardView och ReportView så de aldrig kan glida isär.
// Returnerar: entries, hours, arvode (tid+fastpris), expenses, trips, extra, total.
function weekSummary(data,weekDates){
  const entries=data.entries.filter(e=>weekDates.includes(e.date));
  const hours=entries.reduce((s,e)=>s+e.seconds,0)/3600;
  const arvode=calcWeekRevenue(data,weekDates);
  const expenses=(data.expenses||[]).filter(e=>weekDates.includes(e.date)).reduce((s,e)=>s+e.amount,0);
  const trips=(data.trips||[]).filter(e=>weekDates.includes(e.date)).reduce((s,e)=>s+e.km*(data.kmRate||2.5),0);
  return{entries,hours,arvode,expenses,trips,extra:expenses+trips,total:arvode+expenses+trips};
}

function genICS(entries,projects){const p2=n=>String(n).padStart(2,'0');const fd=(ds,om)=>{const d=new Date(ds+'T08:00:00');d.setMinutes(d.getMinutes()+om);return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+p2(d.getHours())+p2(d.getMinutes())+'00'};let l=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//In Vision Tid//SV","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:In Vision Tid"];const bd={};entries.forEach(e=>{if(!bd[e.date])bd[e.date]=[];bd[e.date].push(e)});Object.entries(bd).forEach(([date,de])=>{let o=0;de.forEach(en=>{const pr=projects.find(p=>p.id===en.projectId);const dur=Math.max(Math.round(en.seconds/60),1);const sm=pr?`${pr.name}: ${en.moment}`:en.moment;l.push("BEGIN:VEVENT",`DTSTART:${fd(date,o)}`,`DTEND:${fd(date,o+dur)}`,`SUMMARY:${sm}`,`UID:${en.id}@invisiontid`,"END:VEVENT");o+=dur})});l.push("END:VCALENDAR");return l.join("\r\n")}

function localDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getWeekDates(off=0){const n=new Date(),dw=n.getDay(),mo=dw===0?-6:1-dw;const mon=new Date(n);mon.setDate(n.getDate()+mo+off*7);mon.setHours(12,0,0,0);return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return localDateStr(d)})}
function weekLabel(ds){const o={day:'numeric',month:'short'};return`${new Date(ds[0]+'T12:00:00').toLocaleDateString('sv-SE',o)} – ${new Date(ds[6]+'T12:00:00').toLocaleDateString('sv-SE',o)}`}

// ── Reseförslag (F3) och eftersläpningsvarning (F4) ──
// project.defaultTripKm är uppdragets normala avstånd tur och retur. Saknas det
// föreslås ingenting. Förslaget bygger på att en resa hör ihop med ett DATUM och
// ett PROJEKT, inte med en enskild tidspost, så flera poster samma dag ger ett förslag.
function getDefaultTripKm(project){const v=project?.defaultTripKm;return(typeof v==='number'&&v>0)?v:null}
function hasTripOn(data,projectId,date){return(data.trips||[]).some(t=>t.projectId===projectId&&t.date===date)}
// Returnerar {projectId,date,km,projectName} eller null om inget ska föreslås.
function suggestTrip(data,projectId,date){
  if(!date)return null;
  const p=(data.projects||[]).find(x=>x.id===projectId);
  const km=getDefaultTripKm(p);
  if(!km)return null;
  if(hasTripOn(data,projectId,date))return null;
  return{projectId,date,km,projectName:p.name};
}
function addDays(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+n);return localDateStr(d)}
// Säkerhetsnät bakåt i tiden: dagar med loggad tid på ett projekt med standardavstånd
// men utan registrerad resa. Fångar poster som aldrig passerar förslaget vid sparning
// (kalenderimport, upprepa igår, poster inlagda på annan enhet).
function missingTrips(data,todayDate,days=14){
  const from=addDays(todayDate,-days);const seen=new Set();const out=[];
  (data.entries||[]).forEach(e=>{
    if(!e.date||e.date<from||e.date>todayDate)return;
    const key=e.projectId+'|'+e.date;if(seen.has(key))return;seen.add(key);
    const s=suggestTrip(data,e.projectId,e.date);if(s)out.push(s);
  });
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
// Senaste registrerade dagen, oavsett om det är tid, utlägg eller resa.
function lastActivityDate(data){
  let last=null;const scan=a=>(a||[]).forEach(x=>{if(x&&x.date&&(!last||x.date>last))last=x.date});
  scan(data?.entries);scan(data?.expenses);scan(data?.trips);return last;
}
function daysBetween(fromDate,toDate){
  if(!fromDate||!toDate)return null;
  const a=new Date(fromDate+'T12:00:00'),b=new Date(toDate+'T12:00:00');
  if(isNaN(a.getTime())||isNaN(b.getTime()))return null;
  return Math.round((b-a)/86400000);
}
// {lastDate, days, limit, stale}. days är null när ingenting alls är registrerat,
// och då är stale false – en tom app ska inte klaga, den har inget att släpa efter med.
function staleStatus(data,todayDate){
  const limit=data?.settings?.staleWarningDays??7;
  const lastDate=lastActivityDate(data);
  const days=daysBetween(lastDate,todayDate);
  return{lastDate,days,limit,stale:days!=null&&days>limit};
}
function lastActivityLabel(days){if(days==null)return null;if(days<=0)return'idag';if(days===1)return'igår';return'för '+days+' dagar sedan'}

function Icon({id,size=18}){
  const common={width:size,height:size,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round",style:{flexShrink:0}};
  if(id==='timer')return <svg {...common}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
  if(id==='dash')return <svg {...common}><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
  if(id==='week')return <svg {...common}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
  if(id==='entries')return <svg {...common}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>;
  if(id==='report')return <svg {...common}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>;
  return null;
}

// ── Shared Components ──
// Toast context for app-wide notifications
const ToastCtx=React.createContext();
function ToastProvider({children}){
  const[toast,setToast]=useState(null);const tRef=useRef(null);
  // ms är valfri – frågor som kräver ett svar (t.ex. reseförslaget) får längre tid.
  const show=(msg,action,ms)=>{if(tRef.current)clearTimeout(tRef.current);setToast({msg,action});tRef.current=setTimeout(()=>setToast(null),ms||(action?5000:2500))};
  const dismiss=()=>{if(tRef.current)clearTimeout(tRef.current);setToast(null)};
  return<ToastCtx.Provider value={show}>{children}{toast&&<div className="toast"><span style={{flex:1}}>{toast.msg}</span>{toast.action&&<button onClick={()=>{toast.action();dismiss()}}>{toast.action.label||'Ångra'}</button>}</div>}</ToastCtx.Provider>
}
function useToast(){return React.useContext(ToastCtx)}

function InstallBanner(){const[show,setShow]=useState(false);const[isIOS,setIsIOS]=useState(false);useEffect(()=>{const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;const sa=window.navigator.standalone||window.matchMedia('(display-mode:standalone)').matches;if(ios&&!sa){setIsIOS(true);setShow(true)}const h=()=>setShow(true);window.addEventListener('pwainstallable',h);if(deferredPrompt)setShow(true);return()=>window.removeEventListener('pwainstallable',h)},[]);const hi=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;setShow(false)}};if(!show)return null;if(isIOS)return<div className="install-banner"><span style={{flex:1}}>Installera: tryck <strong>Dela</strong> och <strong>Hemskärmen</strong></span><button className="dismiss" onClick={()=>setShow(false)}>x</button></div>;return<div className="install-banner"><span style={{flex:1}}>Installera In Vision Tid</span><button onClick={hi}>Installera</button><button className="dismiss" onClick={()=>setShow(false)}>x</button></div>}

function Pill({label,color,selected,onClick}){return<button onClick={onClick} style={{...S.pill,background:selected?color:'transparent',color:selected?'#fff':color,border:`2px solid ${color}`,fontWeight:selected?700:500}}>{label}</button>}

function TabBar({active,onChange}){
  const tabs=[
    {id:'timer',label:'Logga'},
    {id:'dash',label:'Dashboard'},
    {id:'week',label:'Vecka'},
    {id:'entries',label:'Historik'},
    {id:'report',label:'Rapport'}
  ];
  return<div style={S.tabBar}>{tabs.map(t=><button key={t.id} onClick={()=>onChange(t.id)} style={{...S.tab,...(active===t.id?S.tabActive:{})}}><Icon id={t.id} size={22}/><span className="tab-label" style={{fontSize:12,fontWeight:active===t.id?600:400}}>{t.label}</span></button>)}</div>
}

// ── Edit Entry Modal ──
function EditEntryModal({entry,data,onSave,onClose}){
  const[projectId,setPid]=useState(entry.projectId);
  const[moment,setMom]=useState(entry.moment);
  const[date,setDate]=useState(entry.date);
  const[hours,setH]=useState(String(Math.floor(entry.seconds/3600)));
  const[mins,setM]=useState(String(Math.floor((entry.seconds%3600)/60)));
  const[startTime,setST]=useState(entry.startTime||'');
  const[endTime,setET]=useState(entry.endTime||'');
  const[note,setNote]=useState(entry.note||'');
  useEffect(()=>{
    if(startTime&&endTime){const[sh,sm]=startTime.split(':').map(Number);const[eh,em]=endTime.split(':').map(Number);let diff=(eh*60+em)-(sh*60+sm);if(diff<0)diff+=24*60;setH(String(Math.floor(diff/60)));setM(String(diff%60))}
  },[startTime,endTime]);
  const save=()=>{const s=((parseInt(hours)||0)*3600)+((parseInt(mins)||0)*60);if(s<=0)return;onSave({...entry,projectId,moment:moment||'Allmänt',date,seconds:s,startTime:startTime||undefined,endTime:endTime||undefined,note:note.trim()||undefined});onClose()};
  return<div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div style={S.modalTitle}>Redigera tidspost</div>
    <div style={S.modalField}><label style={S.fieldLabel}>Projekt</label><select style={{...S.input,marginTop:4}} value={projectId} onChange={e=>setPid(e.target.value)}>{data.projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
    <div style={S.modalField}><label style={S.fieldLabel}>Moment</label><input style={{...S.input,marginTop:4}} value={moment} onChange={e=>setMom(e.target.value)}/></div>
    <div style={S.modalField}><label style={S.fieldLabel}>Datum</label><input type="date" style={{...S.input,marginTop:4}} value={date} onChange={e=>setDate(e.target.value)}/></div>
    <div style={{...S.manualRow,...S.modalField}}>
      <div style={S.fieldGroup}><label style={S.fieldLabel}>Från</label><input type="time" style={S.inputSmall} value={startTime} onChange={e=>setST(e.target.value)}/></div>
      <div style={S.fieldGroup}><label style={S.fieldLabel}>Till</label><input type="time" style={S.inputSmall} value={endTime} onChange={e=>setET(e.target.value)}/></div>
      <div style={S.fieldGroup}><label style={S.fieldLabel}>Timmar</label><input type="number" min="0" style={S.inputSmall} value={hours} onChange={e=>setH(e.target.value)}/></div>
      <div style={S.fieldGroup}><label style={S.fieldLabel}>Minuter</label><input type="number" min="0" max="59" style={S.inputSmall} value={mins} onChange={e=>setM(e.target.value)}/></div>
    </div>
    <div style={S.modalField}><label style={S.fieldLabel}>Anteckning</label><textarea style={{...S.textarea,marginTop:4}} placeholder="Valfri anteckning..." value={note} onChange={e=>setNote(e.target.value)}/></div>
    <div style={S.modalBtns}><button onClick={save} style={{...S.confirmBtn,flex:1}}>Spara</button><button onClick={onClose} style={{...S.exportBtn,flex:1,fontSize:14,padding:'10px'}}>Avbryt</button></div>
  </div></div>
}

// ── Split Entry Modal ──
function SplitEntryModal({entry,data,onSplit,onClose}){
  const totalMin=Math.round(entry.seconds/60);
  const[splitMin,setSplitMin]=useState(Math.round(totalMin/2));
  const[moment2,setMom2]=useState('');
  const[proj2,setProj2]=useState(entry.projectId);
  const remaining=totalMin-splitMin;
  const split=()=>{if(splitMin<=0||splitMin>=totalMin)return;
    const e1={...entry,seconds:splitMin*60};
    const e2={id:gid(),projectId:proj2,moment:moment2||'Allmänt',seconds:remaining*60,date:entry.date,startTime:undefined,endTime:undefined,note:entry.note,createdAt:new Date().toISOString()};
    onSplit(e1,e2);onClose()};
  return<div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div style={S.modalTitle}>Dela upp tidspost</div>
    <div style={{background:'var(--sage-ghost)',borderRadius:12,padding:12,marginBottom:16,fontSize:13,color:'var(--text-light)'}}>
      {entry.moment} · {fmtH(entry.seconds)} h · {entry.date}
    </div>
    <div style={S.modalField}>
      <label style={S.fieldLabel}>Del 1: {entry.moment} ({Math.floor(splitMin/60)}h {splitMin%60}min)</label>
      <input type="range" min="1" max={totalMin-1} value={splitMin} onChange={e=>setSplitMin(parseInt(e.target.value))} style={{width:'100%',marginTop:8,accentColor:'var(--sage)'}}/>
    </div>
    <div style={S.modalField}>
      <label style={S.fieldLabel}>Del 2: ({Math.floor(remaining/60)}h {remaining%60}min)</label>
      <input style={{...S.input,marginTop:4}} placeholder="Moment för del 2..." value={moment2} onChange={e=>setMom2(e.target.value)}/>
    </div>
    <div style={S.modalField}>
      <label style={S.fieldLabel}>Projekt för del 2</label>
      <select style={{...S.input,marginTop:4}} value={proj2} onChange={e=>setProj2(e.target.value)}>{data.projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
    </div>
    <div style={S.modalBtns}><button onClick={split} style={{...S.confirmBtn,flex:1}}>Dela upp</button><button onClick={onClose} style={{...S.exportBtn,flex:1,fontSize:14,padding:'10px'}}>Avbryt</button></div>
  </div></div>
}

// ── Edit Project Modal ──
function EditProjectModal({project,data,onSave,onClose}){
  const[name,setName]=useState(project.name);
  const[clientId,setCid]=useState(project.clientId||'');
  const[rate,setRate]=useState(project.hourlyRate!=null?String(project.hourlyRate):'');
  const[sessionPrice,setSessionPrice]=useState(project.sessionPrice!=null?String(project.sessionPrice):'');
  const[tripKm,setTripKm]=useState(project.defaultTripKm!=null?String(project.defaultTripKm):'');
  const[periods,setPeriods]=useState(project.pricingPeriods||[]);
  const addPeriod=()=>setPeriods([...periods,{id:gid(),startDate:today(),endDate:'',type:'fixed',amount:0}]);
  const updPeriod=(id,field,val)=>setPeriods(periods.map(p=>p.id===id?{...p,[field]:val}:p));
  const delPeriod=(id)=>setPeriods(periods.filter(p=>p.id!==id));
  const hasSession=sessionPrice&&parseFloat(sessionPrice)>0;
  const hasPeriods=periods.length>0;
  const save=()=>{if(!name.trim())return;onSave({...project,name:name.trim(),clientId:clientId||undefined,hourlyRate:(!hasSession&&!hasPeriods&&rate)?parseInt(rate):undefined,sessionPrice:sessionPrice?parseFloat(sessionPrice):undefined,defaultTripKm:tripKm&&parseFloat(tripKm)>0?parseFloat(tripKm):undefined,pricingPeriods:periods.length?periods.map(p=>({...p,amount:parseFloat(p.amount)||0})):undefined,fixedPrice:undefined});onClose()};
  return<div className="modal-overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div style={S.modalTitle}>Redigera projekt</div>
    <div style={S.modalField}><label style={S.fieldLabel}>Projektnamn</label><input style={{...S.input,marginTop:4,width:'100%'}} value={name} onChange={e=>setName(e.target.value)} autoFocus/></div>
    <div style={S.modalField}><label style={S.fieldLabel}>Kund</label><select style={{...S.input,marginTop:4}} value={clientId} onChange={e=>setCid(e.target.value)}><option value="">Ingen kund vald</option>{(data.clients||[]).filter(c=>(c.status||'active')!=='closed').sort((a,b)=>a.name.localeCompare(b.name,'sv')).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
    <div style={{display:'flex',gap:10}}>
      <div style={{...S.modalField,flex:1}}><label style={{...S.fieldLabel,opacity:(hasSession||hasPeriods)?.4:1}}>Timpris (kr/h)</label><input type="number" style={{...S.input,marginTop:4,opacity:(hasSession||hasPeriods)?.4:1}} placeholder={String(data.hourlyRate)} value={rate} onChange={e=>setRate(e.target.value)} disabled={hasSession||hasPeriods}/></div>
      <div style={{...S.modalField,flex:1}}><label style={{...S.fieldLabel,opacity:hasPeriods?.4:1}}>Pris per tillfälle (kr)</label><input type="number" style={{...S.input,marginTop:4,opacity:hasPeriods?.4:1}} placeholder="Valfritt" value={sessionPrice} onChange={e=>setSessionPrice(e.target.value)} disabled={hasPeriods}/></div>
    </div>
    {hasSession&&!hasPeriods&&<div style={{fontSize:12,color:'var(--sage)',marginTop:-8,marginBottom:8}}>Pris per tillfälle aktivt – varje loggad dag räknas som ett tillfälle</div>}
    {hasPeriods&&<div style={{fontSize:12,color:'var(--sage)',marginTop:-8,marginBottom:8}}>Prisperioder aktivt – timpris och tillfällepris ignoreras</div>}
    <div style={S.modalField}><label style={S.fieldLabel}>Standardresa tur och retur (km)</label>
      <input type="number" step="1" min="0" style={{...S.input,marginTop:4}} placeholder="Valfritt – t.ex. 23" value={tripKm} onChange={e=>setTripKm(e.target.value)}/>
      <div style={{...S.hint,paddingTop:6}}>Appen föreslår resan när du loggar tid på projektet en dag som saknar registrerad resa.</div>
    </div>
    <div style={S.modalField}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><label style={S.fieldLabel}>Prisperioder</label><button onClick={addPeriod} style={{...S.addBtn,padding:'4px 12px',fontSize:12}}>+ Ny period</button></div>
      {periods.length===0&&<span style={{...S.hint,padding:'6px 0'}}>Inga prisperioder – standard timpris gäller</span>}
      {periods.map((p,i)=><div key={p.id} style={{background:'var(--sage-ghost)',borderRadius:12,padding:12,marginTop:8}}>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{flex:1,minWidth:90}}><label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)'}}>Från</label><input type="date" style={{...S.input,fontSize:14,padding:'8px 10px',marginTop:2}} value={p.startDate} onChange={e=>updPeriod(p.id,'startDate',e.target.value)}/></div>
          <div style={{flex:1,minWidth:90}}><label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)'}}>Till</label><input type="date" style={{...S.input,fontSize:14,padding:'8px 10px',marginTop:2,borderColor:p.type==='fixed'&&!p.endDate?'var(--accent)':'var(--border)'}} value={p.endDate||''} onChange={e=>updPeriod(p.id,'endDate',e.target.value)}/></div>
          {p.type==='fixed'&&!p.endDate&&<div style={{width:'100%',fontSize:11,color:'var(--accent)',marginTop:4}}>Ange slutdatum för att fördela fastpriset per vecka. Utan slutdatum räknas hela beloppet veckan det startar.</div>}
          <div style={{minWidth:80}}><label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)'}}>Typ</label><select style={{...S.input,fontSize:14,padding:'8px 10px',marginTop:2}} value={p.type} onChange={e=>updPeriod(p.id,'type',e.target.value)}><option value="fixed">Fastpris</option><option value="hourly">Timpris</option></select></div>
          <div style={{minWidth:80}}><label style={{fontSize:12,fontWeight:600,color:'var(--text-muted)'}}>{p.type==='fixed'?'Belopp (kr)':'Kr/h'}</label><input type="number" style={{...S.input,fontSize:14,padding:'8px 10px',marginTop:2}} value={p.amount||''} onChange={e=>updPeriod(p.id,'amount',e.target.value)}/></div>
          <button onClick={()=>delPeriod(p.id)} style={{...S.deleteBtn,marginBottom:4}}>x</button>
        </div>
      </div>)}
    </div>
    <div style={S.modalBtns}><button onClick={save} style={{...S.confirmBtn,flex:1}}>Spara</button><button onClick={onClose} style={{...S.exportBtn,flex:1,fontSize:14,padding:'10px'}}>Avbryt</button></div>
  </div></div>
}

  </div></div>
}

// ── Timer View ──
function TimerView({data,setData,openSettings}){
  const toast=useToast();
  const[running,setRunning]=useState(false);const[elapsed,setElapsed]=useState(0);
  const[selProj,setSelProj]=useState(null);const[moment,setMom]=useState('');const[note,setNote]=useState('');
  const[showNew,setShowNew]=useState(false);const[newName,setNewName]=useState('');const[newClient,setNewClient]=useState('');const[newRate,setNewRate]=useState('');
  const intRef=useRef(null),startRef=useRef(null);
  const[showManual,setShowManual]=useState(false);const[mDate,setMDate]=useState(today());const[mH,setMH]=useState('');const[mM,setMM]=useState('');const[mMom,setMMom]=useState('');const[mProj,setMProj]=useState(null);const[mNote,setMNote]=useState('');const[mStart,setMStart]=useState('');const[mEnd,setMEnd]=useState('');
  const[showExpense,setShowExpense]=useState(false);const[expType,setExpType]=useState('expense');const[expDate,setExpDate]=useState(today());const[expProj,setExpProj]=useState('');const[expDesc,setExpDesc]=useState('');const[expAmount,setExpAmount]=useState('');const[expKm,setExpKm]=useState('');
  const[showExtra,setShowExtra]=useState(false);
  const[projSearch,setProjSearch]=useState('');

  // Auto-calc hours/minutes when start/end times change
  useEffect(()=>{
    if(mStart&&mEnd){
      const[sh,sm]=mStart.split(':').map(Number);const[eh,em]=mEnd.split(':').map(Number);
      let diff=(eh*60+em)-(sh*60+sm);if(diff<0)diff+=24*60;
      setMH(String(Math.floor(diff/60)));setMM(String(diff%60));
    }
  },[mStart,mEnd]);

  // Restore running timer on mount
  useEffect(()=>{
    try{const saved=JSON.parse(localStorage.getItem(TIMER_KEY)||'null');
      if(saved&&saved.running&&saved.startedAt){
        const el=Math.floor((Date.now()-saved.startedAt)/1000);
        if(saved.selProj)setSelProj(saved.selProj);
        if(saved.moment)setMom(saved.moment);
        if(saved.note)setNote(saved.note);
        setElapsed(el);setRunning(true);setShowManual(true);
      }
    }catch{}
  },[]);

  useEffect(()=>{if(running){startRef.current=Date.now()-elapsed*1000;intRef.current=setInterval(()=>setElapsed(Math.floor((Date.now()-startRef.current)/1000)),1000)}else clearInterval(intRef.current);return()=>clearInterval(intRef.current)},[running]);

  const startTimer=()=>{if(!selProj)return;const startedAt=Date.now()-elapsed*1000;try{localStorage.setItem(TIMER_KEY,JSON.stringify({running:true,startedAt,selProj,moment,note}))}catch{}setRunning(true)};
  const stop=()=>{setRunning(false);try{localStorage.removeItem(TIMER_KEY)}catch{}if(elapsed>0&&selProj){const e={id:gid(),projectId:selProj,moment:moment||'Allmänt',seconds:elapsed,date:today(),createdAt:new Date().toISOString(),note:note.trim()||undefined};const u={...data,entries:[...data.entries,e]};setData(u);saveLocal(u);savedWithTripHint(u,selProj,e.date,'✓ Tid sparad')}setElapsed(0);setMom('');setNote('')};
  const cancelTimer=()=>{setRunning(false);setElapsed(0);try{localStorage.removeItem(TIMER_KEY)}catch{}};
  // F3 – reseförslag. Lägger till mot senaste state (setData med funktion) eftersom
  // förslaget kan bli kvar på skärmen i flera sekunder och annat kan hinna sparas emellan.
  const addTrip=(s)=>{
    const tr={id:gid(),projectId:s.projectId,km:s.km,description:'Resa',date:s.date,createdAt:new Date().toISOString()};
    setData(prev=>{const u={...prev,trips:[...(prev.trips||[]),tr]};saveLocal(u);return u});
    toast('✓ Resa '+s.km+' km tillagd');
  };
  const savedWithTripHint=(updated,projectId,date,okMsg)=>{
    const s=suggestTrip(updated,projectId,date);
    if(!s){toast(okMsg);return}
    const act=()=>addTrip(s);act.label='Lägg till';
    toast('Lägg till resa '+s.km+' km för '+s.projectName+'?',act,9000);
  };
  const addProj=()=>{if(!newName.trim())return;const p={id:gid(),name:newName.trim(),clientId:newClient||undefined,hourlyRate:newRate?parseInt(newRate):undefined};const u={...data,projects:[...data.projects,p]};setData(u);saveLocal(u);setSelProj(p.id);setNewName('');setNewClient('');setNewRate('');setShowNew(false)};
  const addManual=()=>{const p=mProj||selProj;if(!p)return;const s=((parseInt(mH)||0)*3600)+((parseInt(mM)||0)*60);if(s<=0)return;const e={id:gid(),projectId:p,moment:mMom||'Allmänt',seconds:s,date:mDate,startTime:mStart||undefined,endTime:mEnd||undefined,createdAt:new Date().toISOString(),note:mNote.trim()||undefined};const u={...data,entries:[...data.entries,e]};setData(u);saveLocal(u);setMH('');setMM('');setMMom('');setMNote('');setMStart('');setMEnd('');savedWithTripHint(u,p,mDate,'✓ Tid sparad')};
  const addExpense=()=>{const p=expProj||selProj;if(!p)return;if(expType==='expense'){const amt=parseFloat(expAmount);if(!amt||amt<=0)return;const ex={id:gid(),projectId:p,amount:amt,description:expDesc||'Utlägg',date:expDate,createdAt:new Date().toISOString()};const u={...data,expenses:[...(data.expenses||[]),ex]};setData(u);saveLocal(u);toast('✓ Utlägg sparat')}else{const km=parseFloat(expKm);if(!km||km<=0)return;const tr={id:gid(),projectId:p,km:km,description:expDesc||'Resa',date:expDate,createdAt:new Date().toISOString()};const u={...data,trips:[...(data.trips||[]),tr]};setData(u);saveLocal(u);toast('✓ Resa sparad')}setExpDesc('');setExpAmount('');setExpKm('');setShowExpense(false)};
  const repeatYesterday=()=>{
    const y=new Date();y.setDate(y.getDate()-1);const yDate=localDateStr(y);
    const yEntries=data.entries.filter(e=>e.date===yDate);
    if(yEntries.length===0){toast('Inga poster från igår att upprepa');return}
    const todayDate=today();
    const hasToday=data.entries.some(e=>e.date===todayDate);
    if(hasToday&&!confirm('Du har redan poster idag. Lägg till gårdagens poster ändå?'))return;
    const newEntries=yEntries.map(e=>({...e,id:gid(),date:todayDate,createdAt:new Date().toISOString(),calEventId:undefined}));
    const u={...data,entries:[...data.entries,...newEntries]};

  };

  return<div style={{paddingTop:8}}>
    {/* Week revenue - primary focus */}
    {(()=>{
      const wd=getWeekDates(0);
      const wRev=calcWeekRevenue(data,wd);
      const goal=data.weeklyGoal||0;
      const pct=goal>0?Math.min(Math.round(wRev/goal*100),100):0;

          </div>

        {(()=>{
          // F4 – dagar sedan senaste registrering, alltid synlig i startvyn

          if(tH<=0&&!lbl)return null;

        {tExp.map(exp=>{const proj=data.projects.find(p=>p.id===exp.projectId);return<div key={exp.id} style={S.entryRow}><div style={{...S.entryDot,background:'var(--accent)'}}/><div style={S.entryInfo}><span style={S.entryProject}>{exp.description}</span><span style={S.entryMoment}>{proj?.name||'?'} · Utlägg</span></div><span style={S.entryTime}>{exp.amount} kr</span></div>})}

// ── Dashboard View ──
function DashboardView({data,weekOffset,setWeekOffset}){
  const dashWeek=weekOffset;const setDashWeek=setWeekOffset;
  const now=new Date();
  const thisMonth=now.getMonth(),thisYear=now.getFullYear();
  const lastMonth=thisMonth===0?11:thisMonth-1,lastYear=thisMonth===0?thisYear-1:thisYear;
  const monthNames=['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
  const todayDate=today();

  // Parse date string to month/year without timezone issues
  const parseMonth=(dateStr)=>{const p=dateStr.split('-');return{m:parseInt(p[1])-1,y:parseInt(p[0])}};

  // This month's data
  const mEntries=data.entries.filter(e=>{const p=parseMonth(e.date);return p.m===thisMonth&&p.y===thisYear});
  const mSec=mEntries.reduce((s,e)=>s+e.seconds,0);const mH=mSec/3600;
  let mCost=calcRevenue(mEntries,data)+calcFixedMonthly(data,thisYear,thisMonth);
  const mExp=(data.expenses||[]).filter(e=>{const p=parseMonth(e.date);return p.m===thisMonth&&p.y===thisYear}).reduce((s,e)=>s+e.amount,0);
  const mTrips=(data.trips||[]).filter(e=>{const p=parseMonth(e.date);return p.m===thisMonth&&p.y===thisYear}).reduce((s,e)=>s+e.km*(data.kmRate||2.5),0);
  const mTotal=mCost+mExp+mTrips;
  const mProjects=new Set(mEntries.map(e=>e.projectId)).size;

  // Last month's data (for comparison)
  const lEntries=data.entries.filter(e=>{const p=parseMonth(e.date);return p.m===lastMonth&&p.y===lastYear});
  const lH=lEntries.reduce((s,e)=>s+e.seconds,0)/3600;
  let lCost=calcRevenue(lEntries,data)+calcFixedMonthly(data,lastYear,lastMonth);

  const diffH=mH-lH;const diffPct=lH>0?Math.round((diffH/lH)*100):0;

  // Weekly trend (last 12 weeks)
  const weeklyData=[];
  for(let w=11;w>=0;w--){
    const wd=getWeekDates(-w);
    const wSec=data.entries.filter(e=>wd.includes(e.date)).reduce((s,e)=>s+e.seconds,0);
    const wStart=new Date(wd[0]+'T12:00:00');
    weeklyData.push({label:`${wStart.getDate()}/${wStart.getMonth()+1}`,hours:wSec/3600});
  }
  const maxWH=Math.max(...weeklyData.map(w=>w.hours),1);

  // Top projects this month
  const projTime={};mEntries.forEach(e=>{if(!projTime[e.projectId])projTime[e.projectId]=0;projTime[e.projectId]+=e.seconds});
  const topProjects=Object.entries(projTime).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxProjSec=topProjects.length>0?topProjects[0][1]:1;

  // Activity heatmap (last 30 days)
  const heatDays=[];
  for(let d=29;d>=0;d--){
    const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()-d,12,0,0);
    const ds=localDateStr(dt);
    const sec=data.entries.filter(e=>e.date===ds).reduce((s,e)=>s+e.seconds,0);
    heatDays.push({date:ds,hours:sec/3600,day:dt.getDay(),dayNum:dt.getDate()});
  }
  const maxHeat=Math.max(...heatDays.map(d=>d.hours),1);

  const card={background:'var(--card)',borderRadius:16,padding:16,border:'1px solid var(--border)',boxShadow:'0 4px 20px rgba(0,0,0,.06)',marginBottom:14};
  const compStyle=(val)=>({fontSize:12,fontWeight:600,color:val>0?'var(--sage)':val<0?'var(--accent)':'var(--text-muted)'});

  return<div style={{paddingTop:8}}>
    {/* Week navigation */}
    <div style={S.weekNav}>
      <button onClick={()=>setDashWeek(dashWeek-1)} style={S.weekNavBtn}>{'◀'}</button>
      <div style={S.weekNavCenter}>
        <span style={S.weekLabel}>{weekLabel(getWeekDates(dashWeek))}</span>
        {dashWeek===0&&<span style={{fontSize:12,color:'var(--sage)',fontWeight:600}}>Denna vecka</span>}
      </div>
      <button onClick={()=>setDashWeek(dashWeek+1)} style={{...S.weekNavBtn,opacity:dashWeek>=0?.3:1}} disabled={dashWeek>=0}>{'▶'}</button>
      {dashWeek!==0&&<button onClick={()=>setDashWeek(0)} style={S.weekTodayBtn}>Denna vecka</button>}
    </div>

    {/* Today indicator - only show for current week */}
    {dashWeek===0&&(()=>{const todayDate=today();const tEntries=data.entries.filter(e=>e.date===todayDate);const tH=tEntries.reduce((s,e)=>s+e.seconds,0)/3600;
      let tRev=calcRevenue(tEntries,data);
      return<div style={{background:tH>0?'var(--sage-deep)':'var(--card)',borderRadius:16,padding:'16px',marginBottom:16,color:tH>0?'#fff':'var(--text)',border:tH>0?'none':'2px dashed var(--border)',boxShadow:tH>0?'0 4px 16px rgba(45,62,51,.25)':'none'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div><div style={{fontSize:12,fontWeight:600,opacity:.7,textTransform:'uppercase',letterSpacing:'1px'}}>Idag</div>
            <div style={{fontSize:28,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",fontVariantNumeric:'tabular-nums',marginTop:2}}>{tH.toFixed(1)} h</div></div>
          {tH>0&&<div style={{textAlign:'right'}}><div style={{fontSize:12,fontWeight:600,opacity:.7,textTransform:'uppercase',letterSpacing:'1px'}}>Intäkt</div>
            <div style={{fontSize:22,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",fontVariantNumeric:'tabular-nums',marginTop:2}}>{tRev.toLocaleString('sv-SE',{maximumFractionDigits:0})} kr</div></div>}
          {tH===0&&<span style={{fontSize:14,color:'var(--text-muted)'}}>Ingen tid loggad ännu</span>}
        </div>
      </div>})()}

    {/* Week summary card */}
    {(()=>{
      const wd=getWeekDates(dashWeek);
      const ws=weekSummary(data,wd);
      const wH=ws.hours,wRev=ws.arvode,wExtra=ws.extra,wTotal=ws.total;
      const fmtKr=v=>v.toLocaleString('sv-SE',{maximumFractionDigits:0});
      return<div style={{background:'var(--sage-ghost)',borderRadius:16,padding:'16px',marginBottom:16}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
          <div><div style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'1.5px'}}>Veckan</div>
            <div style={{fontSize:24,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",fontVariantNumeric:'tabular-nums',marginTop:2,color:'var(--sage-deep)'}}>{wH.toFixed(1)} h</div></div>
          <div style={{textAlign:'right'}}><div style={{fontSize:12,fontWeight:600,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'1.5px'}}>Totalt</div>
            <div style={{fontSize:28,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",fontVariantNumeric:'tabular-nums',marginTop:2,color:'var(--sage-deep)',lineHeight:1.05}}>{fmtKr(wTotal)} kr</div></div>
        </div>
        <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)',display:'flex',flexDirection:'column',gap:6}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--text-muted)'}}><span>Arvode</span><span style={{fontVariantNumeric:'tabular-nums'}}>{fmtKr(wRev)} kr</span></div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--text-muted)'}}><span>Utlägg &amp; resor</span><span style={{fontVariantNumeric:'tabular-nums'}}>{fmtKr(wExtra)} kr</span></div>
        </div>
      </div>})()}

    {/* Month header */}
    <div style={{marginBottom:16}}>
      <span style={{fontSize:20,fontWeight:700,color:'var(--sage-deep)'}}>{monthNames[thisMonth]} {thisYear}</span>
    </div>

    {/* Summary cards */}
    <div style={S.cardRow}>
      <div style={S.summaryCard}>
        <span style={S.cardLabel}>Tid</span>
        <span style={S.cardValue}>{mH.toFixed(1)} h</span>
        <span style={compStyle(diffH)}>{diffH>0?'+':''}{diffH.toFixed(1)} h vs {monthNames[lastMonth]}</span>
      </div>
      <div style={S.summaryCard}>
        <span style={S.cardLabel}>Projekt</span>
        <span style={S.cardValue}>{mProjects}</span>
      </div>
      <div style={{...S.summaryCard,...S.summaryCardAccent}}>
        <span style={S.cardLabel}>Totalt</span>
        <span style={S.cardValue}>{mTotal.toLocaleString('sv-SE',{maximumFractionDigits:0})} kr</span>
      </div>
    </div>

    {/* Project distribution - pie chart */}
    {topProjects.length>1&&<div style={card}>
      <span style={{...S.sectionTitle,marginBottom:12}}>Fördelning per projekt</span>
      <div style={{display:'flex',alignItems:'center',gap:16}}>
        <svg viewBox="0 0 100 100" style={{width:100,height:100,flexShrink:0}}>
          {(()=>{const total=topProjects.reduce((s,[,sec])=>s+sec,0);let cum=0;
            return topProjects.map(([pid,sec],i)=>{const pct=sec/total;const start=cum;cum+=pct;
              const x1=50+40*Math.cos(2*Math.PI*start-Math.PI/2);const y1=50+40*Math.sin(2*Math.PI*start-Math.PI/2);
              const x2=50+40*Math.cos(2*Math.PI*(start+pct)-Math.PI/2);const y2=50+40*Math.sin(2*Math.PI*(start+pct)-Math.PI/2);
              const large=pct>0.5?1:0;const pi=data.projects.findIndex(p=>p.id===pid);
              return<path key={pid} d={topProjects.length===1?`M50,10A40,40,0,1,1,49.99,10Z`:`M50,50L${x1},${y1}A40,40,0,${large},1,${x2},${y2}Z`} fill={pc(pi)} opacity="0.85"/>})})()}
        </svg>
        <div style={{display:'flex',flexDirection:'column',gap:4,flex:1}}>
          {topProjects.map(([pid,sec],i)=>{const proj=data.projects.find(p=>p.id===pid);const pi=data.projects.findIndex(p=>p.id===pid);const pct=Math.round(sec/topProjects.reduce((s,[,v])=>s+v,0)*100);
            return<div key={pid} style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}>
              <div style={{width:8,height:8,borderRadius:'50%',background:pc(pi),flexShrink:0}}/>
              <span style={{flex:1,color:'var(--text)'}}>{proj?.name||'?'}</span>
              <span style={{fontWeight:600,color:'var(--sage-deep)',fontVariantNumeric:'tabular-nums'}}>{pct}%</span>
            </div>})}
        </div>
      </div>
    </div>}

    {/* Weekly trend chart */}
    <div style={card}>
      <span style={{...S.sectionTitle,marginBottom:14}}>Timmar per vecka</span>
      <div style={{display:'flex',alignItems:'flex-end',gap:4,height:100}}>
        {weeklyData.map((w,i)=>{
          const pct=Math.max((w.hours/maxWH)*100,2);
          const isThisWeek=i===weeklyData.length-1;
          return<div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
            <span style={{fontSize:11,color:'var(--text-muted)',fontVariantNumeric:'tabular-nums'}}>{w.hours>0?w.hours.toFixed(0):''}</span>
            <div style={{width:'100%',height:`${pct}%`,background:isThisWeek?'var(--sage)':'var(--sage-pale)',borderRadius:4,minHeight:2,transition:'height 0.4s ease'}}/>
            <span style={{fontSize:11,color:isThisWeek?'var(--sage-deep)':'var(--text-muted)',fontWeight:isThisWeek?600:400}}>{w.label}</span>
          </div>
        })}
      </div>
    </div>

    {/* Top projects */}
    {topProjects.length>0&&<div style={card}>
      <span style={{...S.sectionTitle,marginBottom:12}}>Topp-projekt denna månad</span>
      {topProjects.map(([pid,sec],i)=>{
        const proj=data.projects.find(p=>p.id===pid);const pi=data.projects.findIndex(p=>p.id===pid);
        const h=sec/3600;const pct=(sec/maxProjSec)*100;
        return<div key={pid} style={{marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
            <div style={{...S.entryDot,background:pc(pi)}}/>
            <span style={{fontSize:14,fontWeight:600,color:'var(--text)',flex:1}}>{proj?.name||'?'}</span>
            <span style={{fontSize:13,fontWeight:600,color:'var(--sage-deep)',fontVariantNumeric:'tabular-nums'}}>{h.toFixed(1)} h</span>
          </div>
          <div style={S.barTrack}><div style={{...S.barFill,width:`${pct}%`,background:pc(pi)}}/></div>
        </div>
      })}
    </div>}

    {/* Activity heatmap */}
    <div style={card}>
      <span style={{...S.sectionTitle,marginBottom:12}}>Aktivitet senaste 30 dagarna</span>
      <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
        {heatDays.map((d,i)=>{
          const intensity=d.hours>0?Math.max(0.2,d.hours/maxHeat):0;
          const bg=d.hours>0?`rgba(94,115,104,${intensity})`:'var(--sage-ghost)';
          const isToday=d.date===todayDate;
          return<div key={i} title={`${d.date}: ${d.hours.toFixed(1)} h`} style={{
            width:26,height:26,borderRadius:5,background:bg,
            border:isToday?'2px solid var(--sage-deep)':'1px solid transparent',
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:11,color:d.hours>maxHeat*0.5?'#fff':'var(--text-muted)',fontWeight:500,
          }}>{d.dayNum}</div>
        })}
      </div>
      <div style={{display:'flex',gap:12,marginTop:8,fontSize:11,color:'var(--text-muted)'}}>
        <span>Mindre</span>
        <div style={{display:'flex',gap:2}}>
          {[0,0.2,0.4,0.7,1].map((v,i)=><div key={i} style={{width:12,height:12,borderRadius:2,background:v===0?'var(--sage-ghost)':`rgba(94,115,104,${v})`}}/>)}
        </div>
        <span>Mer</span>
      </div>
    </div>

  </div>
}

// ── Week View (with calendar) ──
function WeekView({data,setData,msConnected,weekOffset,setWeekOffset}){
  const wo=weekOffset;const setWo=setWeekOffset;
  const[calEvents,setCalEvents]=useState([]);
  const[calLoading,setCalLoading]=useState(false);
  const[importProj,setImportProj]=useState('');
  const[hiddenEvents,setHiddenEvents]=useState(()=>{try{return JSON.parse(localStorage.getItem('invisiontid-hidden-cal')||'[]')}catch{return[]}});
  const wd=getWeekDates(wo),wl=weekLabel(wd);
  const we=data.entries.filter(e=>wd.includes(e.date)),wt=we.reduce((s,e)=>s+e.seconds,0);
  const dt=wd.map(d=>data.entries.filter(e=>e.date===d).reduce((s,e)=>s+e.seconds,0));
  const mx=Math.max(...dt,3600);

  useEffect(()=>{
    const t=getMsToken();
    if(!t||!msConnected)return;
    setCalLoading(true);
    // Fetch one extra day on each side to handle UTC/Stockholm offset
    const dayBefore = new Date(new Date(wd[0]+'T12:00:00'));dayBefore.setDate(dayBefore.getDate()-1);
    const dayAfter = new Date(new Date(wd[6]+'T12:00:00'));dayAfter.setDate(dayAfter.getDate()+1);
    const fetchStart = dayBefore.toISOString().slice(0,10);
    const fetchEnd = dayAfter.toISOString().slice(0,10);
    fetchCalendarEvents(t,fetchStart,fetchEnd).then(events=>{
      // Filter to only events whose local date falls within the week
      setCalEvents(events.filter(ev=>ev.date>=wd[0]&&ev.date<=wd[6]));
      setCalLoading(false);
    }).catch(()=>setCalLoading(false));
  },[wo,msConnected]);

  const hideEvent=(evId)=>{const updated=[...hiddenEvents,evId];setHiddenEvents(updated);try{localStorage.setItem('invisiontid-hidden-cal',JSON.stringify(updated))}catch{}};
  const showAllHidden=()=>{setHiddenEvents([]);try{localStorage.removeItem('invisiontid-hidden-cal')}catch{}};

  const visibleEvents=calEvents.filter(ev=>!hiddenEvents.includes(ev.id));
  const hiddenCount=calEvents.length-visibleEvents.length;

  const importEvent=(ev)=>{
    const pid=importProj||data.projects[0]?.id;
    if(!pid){alert('Skapa ett projekt först');return}
    const dur=calEventDuration(ev);
    if(dur<=0)return;
    const alreadyImported=data.entries.some(e=>e.calEventId===ev.id);
    if(alreadyImported){alert('Redan importerad');return}
    const entry={id:gid(),projectId:pid,moment:ev.subject,seconds:dur,date:ev.date,createdAt:new Date().toISOString(),calEventId:ev.id};
    const u={...data,entries:[...data.entries,entry]};
    setData(u);saveLocal(u);
  };

  const importAllEvents=()=>{
    const pid=importProj||data.projects[0]?.id;
    if(!pid){alert('Skapa ett projekt först');return}
    const importable=visibleEvents.filter(ev=>!ev.isAllDay&&calEventDuration(ev)>0&&!data.entries.some(e=>e.calEventId===ev.id));
    if(importable.length===0)return;
    const newEntries=importable.map(ev=>({id:gid(),projectId:pid,moment:ev.subject,seconds:calEventDuration(ev),date:ev.date,createdAt:new Date().toISOString(),calEventId:ev.id}));
    const u={...data,entries:[...data.entries,...newEntries]};
    setData(u);saveLocal(u);
  };

  const importableCount=visibleEvents.filter(ev=>!ev.isAllDay&&calEventDuration(ev)>0&&!data.entries.some(e=>e.calEventId===ev.id)).length;

  return<div style={{paddingTop:8}}>
    <div style={S.weekNav}><button onClick={()=>setWo(wo-1)} style={S.weekNavBtn}>{'◀'}</button><div style={S.weekNavCenter}><span style={S.weekLabel}>{wl}</span><span style={S.weekTotal}>{fmtH(wt)} h totalt</span></div><button onClick={()=>setWo(wo+1)} style={S.weekNavBtn}>{'▶'}</button>{wo!==0&&<button onClick={()=>setWo(0)} style={S.weekTodayBtn}>Idag</button>}</div>
    <div style={S.weekChart}>{wd.map((date,i)=>{const dayE=data.entries.filter(e=>e.date===date),td=date===today();const byP={};dayE.forEach(e=>{if(!byP[e.projectId])byP[e.projectId]=0;byP[e.projectId]+=e.seconds});const segs=Object.entries(byP).map(([pid,sec])=>({color:pc(data.projects.findIndex(p=>p.id===pid)),pct:(sec/mx)*100}));
      return<div key={date} style={S.weekDayCol}><div style={S.weekBarContainer}>{segs.length>0?segs.map((sg,si)=><div key={si} style={{width:'100%',height:`${Math.max(sg.pct,1)}%`,background:sg.color,borderRadius:si===0?'6px 6px 0 0':si===segs.length-1?'0 0 6px 6px':0}}/>):<div style={{width:'100%',height:'2%',background:'#e5e2dc',borderRadius:6}}/>}</div><span style={{...S.weekDayLabel,fontWeight:td?700:500,color:td?'var(--sage-deep)':'var(--text-muted)'}}>{DN[i]}</span><span style={S.weekDayHours}>{dt[i]>0?fmtH(dt[i]):'–'}</span></div>})}</div>

    {/* Calendar events */}
    {msConnected&&<div style={{...S.section,background:'var(--card)',borderRadius:16,padding:18,border:'1px solid var(--border)',marginBottom:16,boxShadow:'0 4px 20px rgba(0,0,0,.06)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span style={{...S.sectionTitle,marginBottom:0}}>Kalender</span>
        {calLoading&&<span style={{fontSize:11,color:'var(--text-muted)'}}>Laddar...</span>}
      </div>
      {calEvents.length>0&&<div style={{marginBottom:10}}>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <label style={{...S.fieldLabel,marginBottom:0}}>Importera till:</label>
          <select style={{...S.input,flex:'0 1 180px',padding:'6px 10px',fontSize:13}} value={importProj} onChange={e=>setImportProj(e.target.value)}>
            {data.projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
          {importableCount>0&&<button onClick={importAllEvents} style={{...S.confirmBtn,padding:'6px 14px',fontSize:12}}>Importera alla ({importableCount})</button>}
        </div>
      </div>}
      {visibleEvents.length===0&&!calLoading&&<span style={S.hint}>Inga kalenderhändelser denna vecka{hiddenCount>0&&` (${hiddenCount} dolda)`}</span>}
      {wd.map((date,i)=>{
        const dayEvents=visibleEvents.filter(ev=>ev.date===date);
        if(dayEvents.length===0)return null;
        const dO=new Date(date+'T12:00:00'),td=date===today();
        return<div key={'cal-'+date} style={{marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:600,color:td?'var(--sage-deep)':'var(--text-muted)',marginBottom:4}}>{DN[i]} {dO.getDate()}/{dO.getMonth()+1}</div>
          {dayEvents.map(ev=>{
            const dur=calEventDuration(ev);
            const imported=data.entries.some(e=>e.calEventId===ev.id);
            return<div key={ev.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
              <div style={{width:3,height:24,borderRadius:2,background:ev.isAllDay?'#F2CC8F':'#8E7DBE',flexShrink:0}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.subject}</div>
                <div style={{fontSize:11,color:'var(--text-muted)'}}>{ev.isAllDay?'Heldag':calEventTimeStr(ev)}{dur>0&&!ev.isAllDay&&` · ${fmtH(dur)} h`}</div>
              </div>
              {!ev.isAllDay&&dur>0&&!imported&&<button onClick={()=>importEvent(ev)} style={{...S.addBtn,padding:'3px 10px',fontSize:11,borderStyle:'solid'}}>+ Tid</button>}
              {imported&&<span style={{fontSize:11,color:'var(--sage)',fontWeight:600}}>Importerad</span>}
              <button onClick={()=>hideEvent(ev.id)} style={{...S.deleteBtn,fontSize:14,color:'var(--border)'}} title="Dölj händelse">x</button>
            </div>
          })}
        </div>
      })}
      {hiddenCount>0&&<button onClick={showAllHidden} style={{background:'none',border:'none',fontSize:12,color:'var(--text-muted)',padding:'8px 0',textDecoration:'underline',cursor:'pointer'}}>Visa {hiddenCount} dolda händelser</button>}
    </div>}
    {!msConnected&&<div style={{...S.section,background:'var(--sage-ghost)',borderRadius:16,padding:18,textAlign:'center'}}>
      <span style={{fontSize:13,color:'var(--text-muted)'}}>Logga in med Microsoft i Synk-fliken för att se din kalender här.</span>
    </div>}

    {/* Time entries */}
    {wd.map((date,i)=>{const dayE=data.entries.filter(e=>e.date===date);if(!dayE.length)return null;const dayT=dayE.reduce((s,e)=>s+e.seconds,0),dO=new Date(date+'T12:00:00'),td=date===today();
      return<div key={date} style={S.dateGroup}><div style={S.dateHeader}><span style={{...S.dateLabel,fontWeight:td?700:600}}>{DN[i]} {dO.getDate()}/{dO.getMonth()+1}{td&&<span style={{color:'var(--sage)',marginLeft:6,fontSize:11}}>idag</span>}</span><span style={S.dateTotalBadge}>{fmtH(dayT)} h</span></div>
        {dayE.map(en=>{const pr=data.projects.find(p=>p.id===en.projectId);const pi=data.projects.findIndex(p=>p.id===en.projectId);return<div key={en.id} style={S.entryRow}><div style={{...S.entryDot,background:pc(pi)}}/><div style={S.entryInfo}><span style={S.entryProject}>{pr?.name||'?'}</span><span style={S.entryMoment}>{en.startTime&&en.endTime?en.startTime+'–'+en.endTime+' · ':''}{en.moment}{en.note&&<span style={S.noteTag}> — {en.note}</span>}</span></div><span style={S.entryTime}>{fmtH(en.seconds)} h</span></div>})}</div>})}
    {we.length===0&&<span style={S.hint}>Inga registreringar den här veckan</span>}
  </div>
}

// ── Entries View (with edit) ──
function EntriesView({data,setData,weekOffset,setWeekOffset}){

  const[showNewClient,setShowNewClient]=useState(false);
  const[showClosed,setShowClosed]=useState(false);

  const now=()=>new Date().toISOString();
  const addTomb=(ids)=>{const t=now();const map={...(data.deletedIds||{})};ids.forEach(id=>{map[id]=t});return map};
  const del=id=>{const entry=data.entries.find(e=>e.id===id);const u={...data,entries:data.entries.filter(e=>e.id!==id),deletedIds:addTomb([id])};setData(u);saveLocal(u);
    const undo=()=>{const dd={...(u.deletedIds||{})};delete dd[id];const r={...u,entries:[...u.entries,entry],deletedIds:dd};setData(r);saveLocal(r)};undo.label='Ångra';toast('Tidspost borttagen',undo)};

  const saveClient=c=>{const exists=(data.clients||[]).find(x=>x.id===c.id);const withTs={...c,updatedAt:now()};const u={...data,clients:exists?(data.clients||[]).map(x=>x.id===c.id?withTs:x):[...(data.clients||[]),withTs]};setData(u);saveLocal(u);toast('✓ Kund sparad')};
  const delClient=cid=>{const u={...data,clients:(data.clients||[]).filter(c=>c.id!==cid),projects:data.projects.map(p=>p.clientId===cid?{...p,clientId:undefined,updatedAt:now()}:p),deletedIds:addTomb([cid])};setData(u);saveLocal(u)};

    if(!histWd.includes(e.date))return false;

    return e.moment.toLowerCase().includes(searchLower)||(e.note||'').toLowerCase().includes(searchLower)||(proj?.name||'').toLowerCase().includes(searchLower)||e.date.includes(search)});
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));
  const grouped={};sorted.forEach(e=>{if(!grouped[e.date])grouped[e.date]=[];grouped[e.date].push(e)});

  return<div style={{paddingTop:8}}>
    {editEntry&&<EditEntryModal entry={editEntry} data={data} onSave={saveEntry} onClose={()=>setEditEntry(null)}/>}

    {(editClient||showNewClient)&&<ClientModal client={editClient} onSave={c=>{saveClient(c);setShowNewClient(false)}} onClose={()=>{setEditClient(null);setShowNewClient(false)}}/>}

        <button key={t.id} onClick={()=>setSubTab(t.id)} style={{flex:1,padding:'10px 4px',border:'none',background:subTab===t.id?'var(--sage-ghost)':'transparent',color:subTab===t.id?'var(--sage-deep)':'var(--text-muted)',fontSize:13,fontWeight:subTab===t.id?600:400,fontFamily:'inherit',borderBottom:subTab===t.id?'2.5px solid var(--sage-deep)':'2.5px solid transparent',cursor:'pointer'}}>{t.l}</button>)}
    </div>

    {/* TIME TAB */}
    {subTab==='time'&&<div>

          <span style={S.weekLabel}>{weekLabel(histWd)}</span>

        </div>
        <button onClick={()=>setHistWeek(histWeek+1)} style={{...S.weekNavBtn,opacity:histWeek>=0?.3:1}} disabled={histWeek>=0}>{'▶'}</button>

      </div>
      <input style={{...S.input,marginBottom:10}} placeholder="Sök moment, anteckning, projekt..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <div style={{...S.pillRow,marginBottom:12}}>
        <Pill label="Alla" color="var(--sage-deep)" selected={filter==='all'} onClick={()=>setFilter('all')}/>
        {data.projects.map((p,i)=><Pill key={p.id} label={p.name} color={pc(i)} selected={filter===p.id} onClick={()=>setFilter(p.id)}/>)}
      </div>
      {Object.keys(grouped).length===0&&<span style={S.hint}>Inga registreringar att visa</span>}
      {Object.entries(grouped).map(([date,entries])=>{const total=entries.reduce((s,e)=>s+e.seconds,0);
        return<div key={date} style={S.dateGroup}><div style={S.dateHeader}><span style={S.dateLabel}>{new Date(date+'T12:00:00').toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short'})}</span><span style={S.dateTotalBadge}>{fmtH(total)} h</span></div>
          {entries.map(en=>{const pr=data.projects.find(p=>p.id===en.projectId);const pi=data.projects.findIndex(p=>p.id===en.projectId);
            return<div key={en.id} style={S.entryRow}><div style={{...S.entryDot,background:pc(pi)}}/><div style={S.entryInfo}><span style={S.entryProject}>{pr?.name||'?'}</span><span style={S.entryMoment}>{en.startTime&&en.endTime?en.startTime+'–'+en.endTime+' · ':''}{en.moment}{en.note&&<span style={S.noteTag}> — {en.note}</span>}</span></div><span style={S.entryTime}>{fmtH(en.seconds)} h</span><button onClick={()=>setSplitEntry(en)} style={{...S.editBtn,fontSize:13}} title="Dela upp">{'÷'}</button><button onClick={()=>setEditEntry(en)} style={S.editBtn} title="Redigera">{'✎'}</button><button onClick={()=>del(en.id)} style={S.deleteBtn} title="Ta bort">x</button></div>})}</div>})}
    </div>}

    {subTab==='expenses'&&<div>
      <span style={{...S.sectionTitle,marginBottom:12}}>Utlägg</span>
      {(data.expenses||[]).length===0&&<span style={S.hint}>Inga utlägg</span>}

        return<div key={exp.id} style={S.entryRow}><div style={{...S.entryDot,background:'var(--accent)'}}/><div style={S.entryInfo}><span style={S.entryProject}>{exp.description}</span><span style={S.entryMoment}>{proj?.name||'?'} · {new Date(exp.date+'T12:00:00').toLocaleDateString('sv-SE',{day:'numeric',month:'short'})}</span></div><span style={S.entryTime}>{exp.amount} kr</span><button onClick={()=>delExp(exp.id)} style={S.deleteBtn}>x</button></div>})}

      <span style={{...S.sectionTitle,marginTop:24,marginBottom:12}}>Resor</span>
      {(data.trips||[]).length===0&&<span style={S.hint}>Inga resor</span>}

        return<div key={trip.id} style={S.entryRow}><div style={{...S.entryDot,background:'var(--sage-light)'}}/><div style={S.entryInfo}><span style={S.entryProject}>{trip.description}</span><span style={S.entryMoment}>{proj?.name||'?'} · {trip.km} km · {new Date(trip.date+'T12:00:00').toLocaleDateString('sv-SE',{day:'numeric',month:'short'})}</span></div><span style={S.entryTime}>{trip.km*(data.kmRate||2.5)} kr</span><button onClick={()=>delTrip(trip.id)} style={S.deleteBtn}>x</button></div>})}

    {/* PROJECTS TAB */}
    {subTab==='projects'&&<div>
      {data.projects.length===0&&<span style={S.hint}>Inga projekt</span>}

        const hasPeriods=(p.pricingPeriods||[]).length>0;

      {[...(data.clients||[])].filter(c=>(c.status||'active')!=='closed').sort((a,b)=>a.name.localeCompare(b.name,'sv')).map(c=>{const projCount=data.projects.filter(p=>p.clientId===c.id).length;

// ── Report View ──
function ReportView({data,setData}){
  const toast=useToast();
  const[period,setPeriod]=useState('month');const[groupBy,setGroupBy]=useState('project');const[showCompare,setShowCompare]=useState(false);const[exportClient,setExportClient]=useState('');const[exportProj,setExportProj]=useState('');
  const[selMonth,setSelMonth]=useState(()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')});
  const selMonthIdx=parseInt(selMonth.split('-')[1])-1;const selYear=parseInt(selMonth.split('-')[0]);

  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const printProjectReport=(projId)=>{
    const proj=data.projects.find(p=>p.id===projId);if(!proj)return;
    const cl=(data.clients||[]).find(c=>c.id===proj.clientId);
    const rMonth=selMonthIdx;const rYear=selYear;
    const monthFilter=d=>{const parts=d.split('-');return parseInt(parts[1])-1===rMonth&&parseInt(parts[0])===rYear};
    const monthLabel=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'][rMonth]+' '+rYear;
    const pEntries=data.entries.filter(e=>e.projectId===projId&&monthFilter(e.date)).sort((a,b)=>a.date.localeCompare(b.date));
    const pExp=(data.expenses||[]).filter(e=>e.projectId===projId&&monthFilter(e.date));
    const pTrips=(data.trips||[]).filter(e=>e.projectId===projId&&monthFilter(e.date));
    const pRate=getRate(proj,data);
    const totalH=pEntries.reduce((s,e)=>s+e.seconds,0)/3600;
    // Calculate time cost based on pricing model
    let totalTimeCost=0;
    if(hasSessionPrice(proj)){totalTimeCost=getSessionRevenue(proj,pEntries)}
    else if(isFixedPrice(proj)){
      // For fixed price projects in monthly report, calculate the monthly portion
      const mStart=rYear+'-'+String(rMonth+1).padStart(2,'0')+'-01';
      const mEndDay=new Date(rYear,rMonth+1,0).getDate();
      const mEnd=rYear+'-'+String(rMonth+1).padStart(2,'0')+'-'+String(mEndDay).padStart(2,'0');
      (proj.pricingPeriods||[]).forEach(pp=>{
        if(pp.type!=='fixed'||!pp.amount)return;
        const start=pp.startDate;const end=pp.endDate;
        if(!end){if(start>=mStart&&start<=mEnd)totalTimeCost+=pp.amount;return}
        if(mStart>end||mEnd<start)return;
        const sY=parseInt(start.slice(0,4)),sM=parseInt(start.slice(5,7))-1;
        const eY=parseInt(end.slice(0,4)),eM=parseInt(end.slice(5,7))-1;
        const totalMonths=Math.max(1,(eY-sY)*12+(eM-sM)+1);
        totalTimeCost+=Math.round(pp.amount/totalMonths);
      });
    }
    else{totalTimeCost=Math.round(totalH*pRate)}
    const totalExp=pExp.reduce((s,e)=>s+e.amount,0);
    const totalTrip=pTrips.reduce((s,e)=>s+e.km*(data.kmRate||2.5),0);
    const periodLabel=monthLabel;

    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Månadsrapport – ${esc(proj.name)}</title>
    <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Calibri,Arial,sans-serif;padding:40px;color:#1A1816;font-size:14px;background:#F1EBDE}
    h1{font-size:22px;color:#1F2F22;margin-bottom:4px}h2{font-size:16px;color:#3A4B3E;margin:20px 0 8px;border-bottom:2px solid #EFEADD;padding-bottom:4px}
    .meta{color:#6F6959;font-size:13px;margin-bottom:20px}.logo{font-size:11px;color:#6F6959;text-align:right;margin-bottom:20px}
    table{width:100%;border-collapse:collapse;margin:8px 0 16px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6F6959;padding:6px 8px;border-bottom:2px solid #E5DFD1}
    td{padding:6px 8px;border-bottom:1px solid #EFEADD;font-size:13px}td.num{text-align:right;font-variant-numeric:tabular-nums}
    .total-row td{font-weight:700;border-top:2px solid #1F2F22;border-bottom:none;padding-top:10px}
    .summary{background:#EFEADD;border-radius:8px;padding:16px;margin:16px 0;display:flex;gap:24px}
    .summary div{flex:1}.summary .label{font-size:11px;color:#6F6959;text-transform:uppercase}.summary .value{font-size:20px;font-weight:700;color:#1F2F22}
    @media print{body{padding:20px;background:#fff}}</style></head><body>
    <div class="logo">In Vision</div>
    <h1>${esc(proj.name)}</h1>
    <div class="meta">${cl?esc(cl.name)+(cl.orgNr?' · '+esc(cl.orgNr):''):''} · ${esc(periodLabel)}</div>
    <div class="summary">
      <div><div class="label">Tid</div><div class="value">${totalH.toFixed(1)} h</div></div>
      <div><div class="label">${hasSessionPrice(proj)?'Tillfällen':isFixedPrice(proj)?'Fastpris':'Timpris'}</div><div class="value">${hasSessionPrice(proj)?getSessionCount(proj,pEntries)+' st':isFixedPrice(proj)?totalTimeCost.toLocaleString('sv-SE')+' kr':pRate+' kr/h'}</div></div>
      <div><div class="label">Arvode</div><div class="value">${totalTimeCost.toLocaleString('sv-SE',{maximumFractionDigits:0})} kr</div></div>
    </div>
    <h2>Tidsposter</h2>
    <table><tr><th>Datum</th><th>Tid</th><th>Moment</th><th>Anteckning</th><th class="num">Timmar</th></tr>
    ${pEntries.map(e=>`<tr><td>${esc(e.date)}</td><td>${e.startTime&&e.endTime?esc(e.startTime)+'–'+esc(e.endTime):''}</td><td>${esc(e.moment)}</td><td>${esc(e.note||'')}</td><td class="num">${(e.seconds/3600).toFixed(1)}</td></tr>`).join('')}
    <tr class="total-row"><td colspan="4">Summa tid</td><td class="num">${totalH.toFixed(1)} h</td></tr></table>
    ${pExp.length?`<h2>Utlägg</h2><table><tr><th>Datum</th><th>Beskrivning</th><th class="num">Belopp</th></tr>

    <tr class="total-row"><td colspan="2">Summa utlägg</td><td class="num">${totalExp.toLocaleString('sv-SE')} kr</td></tr></table>`:''}
