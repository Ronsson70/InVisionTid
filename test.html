<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>In Vision Tid – enhetstester</title>
<style>
  body{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;background:#1A1816;color:#E8E3D6;padding:24px;font-size:14px;line-height:1.6}
  h1{font-size:18px;color:#9DB3A2}
  .pass{color:#7FB28A}.fail{color:#E08A6A;font-weight:700}
  .sum{margin-top:16px;padding:12px;border-radius:8px;background:#222019}
  code{color:#C4A55A}
</style>
</head>
<body>
<h1>In Vision Tid – enhetstester</h1>
<p>Testar den <strong>gamla</strong> appen, som numera ligger arkiverad i <code>arkiv/v1-app.txt</code>. Nya InVisionTid har sina tester i <code>test/</code> och körs med <code>node --test</code>.</p>
<div id="out">Laddar arkiv/v1-app.txt…</div>

<script>
(async function(){
  const out=document.getElementById('out');
  let passed=0,failed=0;const lines=[];
  const log=(ok,name,extra)=>{ok?passed++:failed++;lines.push(`<div class="${ok?'pass':'fail'}">${ok?'✓':'✗'} ${name}${extra?` — ${extra}`:''}</div>`);};
  const eq=(name,a,b)=>log(JSON.stringify(a)===JSON.stringify(b),name,JSON.stringify(a)===JSON.stringify(b)?'':`fick ${JSON.stringify(a)}, väntade ${JSON.stringify(b)}`);
  const near=(name,a,b,tol=0.5)=>log(Math.abs(a-b)<=tol,name,Math.abs(a-b)<=tol?'':`fick ${a}, väntade ~${b}`);
  const ok=(name,cond,extra)=>log(!!cond,name,extra);

  let M;
  try{
    const src=await (await fetch('arkiv/v1-app.txt')).text();
    const m=src.match(/\/\* PURE-START \*\/([\s\S]*?)\/\* PURE-END \*\//);
    if(!m) throw new Error('Hittade inte PURE-START/PURE-END i arkiv/v1-app.txt');
    const exports='gid,fmtH,today,localDateStr,getWeekDates,weekLabel,getRate,hasSessionPrice,isFixedPrice,getActivePeriod,getSessionCount,getSessionRevenue,calcRevenue,calcFixedMonthly,getFixedWeeklyAmount,calcWeekRevenue,weekSummary,getDefaultTripKm,hasTripOn,suggestTrip,addDays,missingTrips,lastActivityDate,daysBetween,staleStatus,lastActivityLabel,recentProjectIds,lastEntryFor,projectMonthSummary,clientMonthSummaries,pricingModel,hasFixedPeriod';
    M=new Function(m[1]+`;return{${exports}};`)();
  }catch(e){
    out.innerHTML=`<div class="fail">✗ Kunde inte ladda funktioner: ${e.message}<br>Kör via en lokal server (fetch fungerar inte på file://).</div>`;
    return;
  }

  // ── localDateStr / getWeekDates ──
  eq('localDateStr formaterar YYYY-MM-DD', M.localDateStr(new Date(2026,4,3,12,0,0)), '2026-05-03');
  const wk=M.getWeekDates(0);
  eq('getWeekDates ger 7 datum', wk.length, 7);
  ok('getWeekDates: alla YYYY-MM-DD', wk.every(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)));
  ok('getWeekDates: stigande ordning', wk.every((d,i)=>i===0||d>wk[i-1]));
  eq('getWeekDates: [0] är måndag', new Date(wk[0]+'T12:00:00').getDay(), 1);
  eq('getWeekDates: [6] är söndag', new Date(wk[6]+'T12:00:00').getDay(), 0);
  ok('getWeekDates(-1) ligger före getWeekDates(0)', M.getWeekDates(-1)[6] < wk[0]);

  // ── Prissättningsmodeller ──
  const dHourly={projects:[{id:'p1',hourlyRate:1000}],entries:[],expenses:[],trips:[]};
  eq('calcRevenue: timpris 1h*1000', M.calcRevenue([{projectId:'p1',date:'2026-05-12',seconds:3600}],dHourly), 1000);
  eq('calcRevenue: timpris 2.5h*1000', M.calcRevenue([{projectId:'p1',date:'2026-05-12',seconds:9000}],dHourly), 2500);

  const dSession={projects:[{id:'s1',sessionPrice:2000}],entries:[],expenses:[],trips:[]};
  eq('calcRevenue: session – två poster samma dag = 1 tillfälle',
     M.calcRevenue([{projectId:'s1',date:'2026-05-12',seconds:3600},{projectId:'s1',date:'2026-05-12',seconds:1800}],dSession), 2000);
  eq('calcRevenue: session – två olika dagar = 2 tillfällen',
     M.calcRevenue([{projectId:'s1',date:'2026-05-12',seconds:3600},{projectId:'s1',date:'2026-05-13',seconds:3600}],dSession), 4000);

  const dFixed={projects:[{id:'f1',pricingPeriods:[{id:'pp1',type:'fixed',startDate:'2026-03-01',endDate:'2026-06-30',amount:100000}]}],entries:[],expenses:[],trips:[]};
  eq('calcRevenue: fastpris räknas EJ per timme (0)', M.calcRevenue([{projectId:'f1',date:'2026-05-12',seconds:7200}],dFixed), 0);
  eq('calcFixedMonthly: 100000 över 4 mån → 25000/mån', M.calcFixedMonthly(dFixed,2026,4), 25000);
  near('getFixedWeeklyAmount: 25000/mån, hel maj-vecka = 7*(25000/31) ≈ 5645', M.getFixedWeeklyAmount(dFixed.projects[0], ['2026-05-11','2026-05-12','2026-05-13','2026-05-14','2026-05-15','2026-05-16','2026-05-17']), 5645, 1);
  eq('getFixedWeeklyAmount: vecka utanför period = 0',
     M.getFixedWeeklyAmount(dFixed.projects[0], ['2026-01-05','2026-01-06','2026-01-07','2026-01-08','2026-01-09','2026-01-10','2026-01-11']), 0);
  // Avstämning: summan av alla veckor som nuddar mars ska bli månadsbeloppet (ingen 4.33-överskattning)
  const dMar={projects:[{id:'fm',pricingPeriods:[{id:'ppm',type:'fixed',startDate:'2026-03-01',endDate:'2026-03-31',amount:18400}]}],entries:[],expenses:[],trips:[]};
  const marWeeks=[
    ['2026-02-23','2026-02-24','2026-02-25','2026-02-26','2026-02-27','2026-02-28','2026-03-01'],
    ['2026-03-02','2026-03-03','2026-03-04','2026-03-05','2026-03-06','2026-03-07','2026-03-08'],
    ['2026-03-09','2026-03-10','2026-03-11','2026-03-12','2026-03-13','2026-03-14','2026-03-15'],
    ['2026-03-16','2026-03-17','2026-03-18','2026-03-19','2026-03-20','2026-03-21','2026-03-22'],
    ['2026-03-23','2026-03-24','2026-03-25','2026-03-26','2026-03-27','2026-03-28','2026-03-29'],
    ['2026-03-30','2026-03-31','2026-04-01','2026-04-02','2026-04-03','2026-04-04','2026-04-05'],
  ];
  const marSum=marWeeks.reduce((s,w)=>s+M.getFixedWeeklyAmount(dMar.projects[0],w),0);
  near('getFixedWeeklyAmount: veckosummorna stämmer mot månadsbeloppet (18400, ej ~25500)', marSum, 18400, 5);

  const dHourlyPeriod={projects:[{id:'h1',hourlyRate:850,pricingPeriods:[{id:'hp1',type:'hourly',startDate:'2026-05-01',endDate:'2026-05-31',amount:1200}]}],entries:[],expenses:[],trips:[]};
  eq('calcRevenue: hourly-period 1200 slår projektets 850', M.calcRevenue([{projectId:'h1',date:'2026-05-12',seconds:3600}],dHourlyPeriod), 1200);

  // ── weekSummary: enda källan för dashboard + rapport ──
  const week=['2026-05-11','2026-05-12','2026-05-13','2026-05-14','2026-05-15','2026-05-16','2026-05-17'];
  const dWeek={
    kmRate:5.5,
    projects:[{id:'p1',hourlyRate:1000},{id:'f1',pricingPeriods:[{id:'pp1',type:'fixed',startDate:'2026-03-01',endDate:'2026-06-30',amount:100000}]}],
    entries:[
      {projectId:'p1',date:'2026-05-12',seconds:3600},   // 1h * 1000 = 1000
      {projectId:'p1',date:'2026-05-13',seconds:7200},   // 2h * 1000 = 2000
      {projectId:'f1',date:'2026-05-14',seconds:3600},   // fastpris, ej per timme
      {projectId:'p1',date:'2026-04-30',seconds:3600},   // UTANFÖR veckan – ska ignoreras
    ],
    expenses:[{projectId:'p1',date:'2026-05-12',amount:300},{projectId:'p1',date:'2026-04-30',amount:999}],
    trips:[{projectId:'p1',date:'2026-05-13',km:10}], // 10*5.5 = 55
  };
  const ws=M.weekSummary(dWeek,week);
  // 1h + 2h timpris + 1h fastpris = 4h; posten 2026-04-30 ligger utanför veckan och ignoreras
  eq('weekSummary.hours = 4h (all tid i veckan, även fastpris; poster utanför ignoreras)', ws.hours, 4);
  near('weekSummary.arvode = 3000 timpris + 5645 fastpris', ws.arvode, 8645, 1);
  eq('weekSummary.expenses (bara veckans)', ws.expenses, 300);
  eq('weekSummary.trips = 10km*5.5', ws.trips, 55);
  eq('weekSummary.extra = expenses + trips', ws.extra, 355);
  near('weekSummary.total = arvode + extra', ws.total, 8645+355, 1);
  ok('weekSummary.total == calcWeekRevenue + extra (dashboard/rapport matchar)',
     Math.abs(ws.total - (M.calcWeekRevenue(dWeek,week)+ws.extra)) < 0.5);

  // ── F3: reseförslag ──
  // Sauna HVB, 23 km tur och retur. Kravspec v2, testfall T7.
  const dTrip={
    projects:[
      {id:'sauna',name:'Sauna HVB',defaultTripKm:23,sessionPrice:2400},
      {id:'nord',name:'Nordsjögården',hourlyRate:850},              // inget standardavstånd
    ],
    entries:[
      {id:'e1',projectId:'sauna',date:'2026-07-30',seconds:10800},  // 3 tim, ingen resa
      {id:'e2',projectId:'sauna',date:'2026-07-28',seconds:7200},   // har resa, se nedan
      {id:'e3',projectId:'sauna',date:'2026-07-28',seconds:1800},   // samma dag igen
      {id:'e4',projectId:'nord',date:'2026-07-29',seconds:7200},
      {id:'e5',projectId:'sauna',date:'2026-06-02',seconds:7200},   // utanför 14-dagarsfönstret
    ],
    trips:[{id:'t1',projectId:'sauna',date:'2026-07-28',km:23}],
    expenses:[],
  };
  eq('T7: 3 tim på Sauna 30 juli utan resa → förslag 23 km',
     M.suggestTrip(dTrip,'sauna','2026-07-30'), {projectId:'sauna',date:'2026-07-30',km:23,projectName:'Sauna HVB'});
  eq('suggestTrip: dag som redan har resa ger inget förslag', M.suggestTrip(dTrip,'sauna','2026-07-28'), null);
  eq('suggestTrip: projekt utan standardavstånd ger inget förslag', M.suggestTrip(dTrip,'nord','2026-07-29'), null);
  eq('suggestTrip: okänt projekt ger inget förslag', M.suggestTrip(dTrip,'finns-ej','2026-07-30'), null);
  eq('getDefaultTripKm: 0 och saknat värde räknas som inget', [M.getDefaultTripKm({defaultTripKm:0}),M.getDefaultTripKm({}),M.getDefaultTripKm(null)], [null,null,null]);
  eq('hasTripOn: rätt projekt och datum', [M.hasTripOn(dTrip,'sauna','2026-07-28'),M.hasTripOn(dTrip,'sauna','2026-07-30'),M.hasTripOn(dTrip,'nord','2026-07-28')], [true,false,false]);

  eq('addDays: bakåt över månadsskifte', M.addDays('2026-08-05',-14), '2026-07-22');
  const miss=M.missingTrips(dTrip,'2026-08-05',14);
  eq('missingTrips: bara 30 juli saknar resa inom fönstret', miss.map(m=>m.date), ['2026-07-30']);
  eq('missingTrips: förslaget bär projektnamn och km', [miss[0].projectName,miss[0].km], ['Sauna HVB',23]);
  eq('missingTrips: två poster samma dag ger max ett förslag',
     M.missingTrips({...dTrip,trips:[]},'2026-08-05',14).filter(m=>m.date==='2026-07-28').length, 1);
  eq('missingTrips: nyast först',
     M.missingTrips({...dTrip,trips:[]},'2026-08-05',14).map(m=>m.date), ['2026-07-30','2026-07-28']);
  eq('missingTrips: poster utanför fönstret ignoreras',
     M.missingTrips({...dTrip,trips:[]},'2026-08-05',14).some(m=>m.date==='2026-06-02'), false);
  eq('missingTrips: större fönster tar med den',
     M.missingTrips({...dTrip,trips:[]},'2026-08-05',90).some(m=>m.date==='2026-06-02'), true);
  eq('missingTrips: framtida datum ignoreras', M.missingTrips({...dTrip,trips:[]},'2026-07-29',14).map(m=>m.date), ['2026-07-28']);

  // ── F4: eftersläpningsvarning ──
  eq('daysBetween: 30 juli → 5 augusti = 6 dagar', M.daysBetween('2026-07-30','2026-08-05'), 6);
  eq('daysBetween: saknat datum ger null', [M.daysBetween(null,'2026-08-05'),M.daysBetween('2026-08-05',null)], [null,null]);
  eq('lastActivityDate: senaste av tid, utlägg och resa',
     M.lastActivityDate({entries:[{date:'2026-07-30'}],expenses:[{date:'2026-08-01'}],trips:[{date:'2026-07-15'}]}), '2026-08-01');
  eq('lastActivityDate: tom app ger null', M.lastActivityDate({entries:[],expenses:[],trips:[]}), null);

  const dStale={entries:[{date:'2026-07-30'}],expenses:[],trips:[],settings:{staleWarningDays:7}};
  const st6=M.staleStatus(dStale,'2026-08-05');
  eq('staleStatus: 6 dagar med gräns 7 → ingen varning', [st6.days,st6.stale], [6,false]);
  eq('staleStatus: 8 dagar med gräns 7 → varning', (()=>{const s=M.staleStatus(dStale,'2026-08-07');return[s.days,s.stale]})(), [8,true]);
  eq('staleStatus: egen gräns 3 dagar slår igenom',
     (()=>{const s=M.staleStatus({...dStale,settings:{staleWarningDays:3}},'2026-08-05');return[s.limit,s.stale]})(), [3,true]);
  eq('staleStatus: gräns saknas → standard 7',
     M.staleStatus({entries:[{date:'2026-07-30'}],expenses:[],trips:[]},'2026-08-05').limit, 7);
  eq('staleStatus: tom app varnar inte',
     (()=>{const s=M.staleStatus({entries:[],expenses:[],trips:[]},'2026-08-05');return[s.days,s.stale]})(), [null,false]);
  eq('lastActivityLabel: idag, igår, längre bak, inget',
     [M.lastActivityLabel(0),M.lastActivityLabel(1),M.lastActivityLabel(6),M.lastActivityLabel(null)],
     ['idag','igår','för 6 dagar sedan',null]);

  // ── Prismodellens prioritet ──
  // Sauna HVB hade i skarp data BÅDE 2 400 kr per tillfälle och en fastprisperiod
  // på 2 400 kr över 11 juni–30 nov. Det gav dubbelräkning: tillfällena via
  // calcRevenue och dessutom 400 kr per månad via calcFixedMonthly.
  const pSess={id:'s',sessionPrice:2400};
  const pFix={id:'f',pricingPeriods:[{id:'p1',type:'fixed',startDate:'2026-01-01',endDate:'2026-12-31',amount:120000}]};
  const pHour={id:'h',hourlyRate:900};
  const pBoth={id:'b',name:'Sauna HVB',sessionPrice:2400,pricingPeriods:[{id:'p2',type:'fixed',startDate:'2026-06-11',endDate:'2026-11-30',amount:2400}]};

  eq('pricingModel: tillfällespris', M.pricingModel(pSess), 'session');
  eq('pricingModel: fastpris', M.pricingModel(pFix), 'fixed');
  eq('pricingModel: timpris', M.pricingModel(pHour), 'hourly');
  eq('pricingModel: både tillfälle och fastpris → tillfälle vinner', M.pricingModel(pBoth), 'session');
  eq('hasFixedPeriod ser perioden även när den inte gäller', M.hasFixedPeriod(pBoth), true);
  eq('isFixedPrice är falskt när tillfällespriset vinner', M.isFixedPrice(pBoth), false);

  const dBoth={kmRate:5.5,projects:[pBoth],entries:[
    {id:'e1',projectId:'b',date:'2026-07-28',seconds:7200},
    {id:'e2',projectId:'b',date:'2026-07-30',seconds:10800},
  ],trips:[],expenses:[]};
  eq('calcRevenue: två pass à 2 400', M.calcRevenue(dBoth.entries,dBoth), 4800);
  eq('calcFixedMonthly lägger INTE på fastprisandel ovanpå tillfällespriset', M.calcFixedMonthly(dBoth,2026,6), 0);
  eq('getFixedWeeklyAmount ger 0 för projekt med tillfällespris',
     M.getFixedWeeklyAmount(pBoth,['2026-07-27','2026-07-28','2026-07-29','2026-07-30','2026-07-31','2026-08-01','2026-08-02']), 0);
  eq('calcWeekRevenue: bara passen, ingen dubbelräkning',
     M.calcWeekRevenue(dBoth,['2026-07-27','2026-07-28','2026-07-29','2026-07-30','2026-07-31','2026-08-01','2026-08-02']), 4800);
  eq('projectMonthSummary: modellen är session, beloppet 4 800',
     (()=>{const s=M.projectMonthSummary(dBoth,'b','2026-07');return[s.model,s.arvode]})(), ['session',4800]);

  // Rena fastprisprojekt ska fungera precis som förut
  eq('fastpris utan tillfällespris räknas fortfarande per månad', M.calcFixedMonthly({projects:[pFix]},2026,6), 10000);

  // ── Snabb tid och faktureringsunderlag ──
  // Tre prismodeller hos tre olika kunder, plus ett projekt utan kund.
  const dInv={
    kmRate:5.5,
    clients:[{id:'c1',name:'Sauna HVB'},{id:'c2',name:'Train2Lead AB'}],
    projects:[
      {id:'sauna',name:'Sauna HVB',clientId:'c1',sessionPrice:2400,defaultTripKm:23},
      {id:'ff',name:'Framgångsfabriken',clientId:'c2',pricingPeriods:[{id:'pp',type:'fixed',startDate:'2026-03-01',endDate:'2026-06-30',amount:100000}]},
      {id:'nord',name:'Nordsjögården',hourlyRate:850},
    ],
    entries:[
      {id:'a',projectId:'sauna',date:'2026-06-02',seconds:7200,moment:'Behandlingspass',createdAt:'2026-06-02T10:00:00Z'},
      {id:'b',projectId:'sauna',date:'2026-06-02',seconds:3600,moment:'Samtal',createdAt:'2026-06-02T12:00:00Z'},
      {id:'c',projectId:'sauna',date:'2026-06-09',seconds:7200,moment:'Behandlingspass',createdAt:'2026-06-09T10:00:00Z'},
      {id:'d',projectId:'ff',date:'2026-06-10',seconds:7200,moment:'Verkstad',createdAt:'2026-06-10T10:00:00Z'},
      {id:'e',projectId:'nord',date:'2026-06-11',seconds:7200,moment:'Lektion',createdAt:'2026-06-11T10:00:00Z'},
      {id:'f',projectId:'nord',date:'2026-05-11',seconds:3600,moment:'Lektion',createdAt:'2026-05-11T10:00:00Z'},
    ],
    trips:[{id:'t1',projectId:'sauna',date:'2026-06-02',km:23}],
    expenses:[{id:'x1',projectId:'nord',date:'2026-06-11',amount:164}],
  };

  eq('recentProjectIds: nyast loggade först', M.recentProjectIds(dInv,3), ['nord','ff','sauna']);
  eq('recentProjectIds: respekterar gränsen', M.recentProjectIds(dInv,1), ['nord']);
  eq('recentProjectIds: tom app ger tom lista', M.recentProjectIds({entries:[]},3), []);
  eq('lastEntryFor: senaste posten på projektet', M.lastEntryFor(dInv,'sauna').id, 'c');
  eq('lastEntryFor: samma dag → senast skapade', M.lastEntryFor({entries:dInv.entries.filter(e=>e.date==='2026-06-02')},'sauna').id, 'b');
  eq('lastEntryFor: okänt projekt ger null', M.lastEntryFor(dInv,'finns-ej'), null);

  const sSauna=M.projectMonthSummary(dInv,'sauna','2026-06');
  eq('projectMonthSummary: pris per tillfälle räknar unika dagar', [sSauna.model,sSauna.units,sSauna.arvode], ['session',2,4800]);
  eq('projectMonthSummary: timmar räknas även vid tillfällespris', sSauna.hours, 5);
  eq('projectMonthSummary: resa 23 km à 5,50', sSauna.tripAmount, 126.5);
  eq('projectMonthSummary: total = arvode + resa + utlägg', sSauna.total, 4926.5);

  const sFF=M.projectMonthSummary(dInv,'ff','2026-06');
  eq('projectMonthSummary: fastpris 100000 över 4 mån → 25000', [sFF.model,sFF.arvode], ['fixed',25000]);
  eq('projectMonthSummary: fastpris räknas inte per timme', sFF.total, 25000);

  const sNord=M.projectMonthSummary(dInv,'nord','2026-06');
  eq('projectMonthSummary: timpris 2h à 850 + utlägg 164', [sNord.model,sNord.arvode,sNord.total], ['hourly',1700,1864]);
  eq('projectMonthSummary: annan månad räknas inte med', M.projectMonthSummary(dInv,'nord','2026-05').arvode, 850);
  eq('projectMonthSummary: månad utan poster ger noll', M.projectMonthSummary(dInv,'nord','2026-01').count, 0);

  const groups=M.clientMonthSummaries(dInv,'2026-06');
  eq('clientMonthSummaries: en post per kund, störst först', groups.map(g=>g.name), ['Train2Lead AB','Sauna HVB','Utan kund']);
  eq('clientMonthSummaries: kundens total är summan av projekten', groups[1].total, 4926.5);
  eq('clientMonthSummaries: projekt utan kund hamnar för sig', groups[2].projects.map(p=>p.projectId), ['nord']);
  eq('clientMonthSummaries: månad utan aktivitet ger tom lista', M.clientMonthSummaries(dInv,'2026-01'), []);

  out.innerHTML=lines.join('')+
    `<div class="sum"><strong class="${failed?'fail':'pass'}">${passed} godkända, ${failed} misslyckade</strong></div>`;
})();
</script>
</body>
</html>
